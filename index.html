        async function doConnect(setId) {
            const st = document.getElementById('gh-status');
            const token = document.getElementById('gh-token').value.trim();
            if (!token) { st.textContent = 'Paste your token first.'; return; }
            st.className = 'text-xs text-slate-500';
            st.textContent = 'Checking…';
            try {
                let res;
                try {
                    res = await fetch(GH_API + '/user', { headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token } });
                } catch (e) { throw new Error('Could not reach GitHub. Check your internet connection.'); }
                if (!res.ok) throw new Error('GitHub did not accept that token. Make sure you copied all of it.');
                const scopes = res.headers.get('X-OAuth-Scopes');
                if (scopes !== null && !/\bgist\b/.test(scopes)) throw new Error('That token is missing the "gist" permission. Create a new one with the button above.');
                const u = await res.json();
                ghSetAuth({ token, login: u.login });
                shareNote = 'Connected as ' + u.login + '.';
                if (setId) shareSetCode(setId); else openPublishSetup();
            } catch (e) {
                st.className = 'text-xs font-semibold text-red-500';
                st.textContent = e.message || 'Something went wrong.';
            }
        }

        function openPublishSetup() {
            closeModal();
            window.router.navigate('account');
        }

        function disconnectGithub() {
            ghSetAuth(null);
            window.router.navigate('account');
        }

        function setAutoPublish(on) {
            const st = getSettings(); st.autoPublish = !!on; saveSettings(st);
        }

        function showToast(msg, isError) {
            let t = document.getElementById('quizit-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'quizit-toast';
                document.body.appendChild(t);
            }
            t.className = 'fixed bottom-4 right-4 z-[60] max-w-xs text-xs font-semibold px-4 py-3 rounded-xl shadow-lg ' + (isError ? 'bg-red-500 text-white' : 'bg-slate-800 text-white');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(t._hide);
            t._hide = setTimeout(() => { t.style.display = 'none'; }, isError ? 8000 : 2500);
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
            const ta = document.createElement('textarea');
            ta.value = text; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            return Promise.resolve();
        }

        function copyLink(setId) {
            const s = getDB().sets.find(x => x.id === setId);
            if (!s || !s.gist) return;
            copyText(buildShareLink(s.gist.alias || s.gist.id, s.gist.owner)).then(
                () => showToast('Link copied ✓'),
                () => showToast('Could not copy automatically. Select the link and copy it.', true));
        }

        // One publish at a time per set, so quick consecutive saves land in order
        const publishQueue = {};
        function queuePublish(setId) {
            const run = () => {
                const s = getDB().sets.find(x => x.id === setId);
                if (!s || !s.gist) return Promise.resolve();
                return publishSetToGist(setId, s.gist.alias || '');
            };
            const p = (publishQueue[setId] || Promise.resolve()).catch(() => {}).then(run);
            publishQueue[setId] = p;
            return p;
        }

        function isMyPublished(s, auth) {
            return !!(auth && s && s.gist && s.gist.owner && s.gist.owner.toLowerCase() === auth.login.toLowerCase());
        }

        // Called after every save: if this set is already published by you, update the same gist
        async function autoPublishIfLinked(setId) {
            const auth = ghGetAuth();
            const set = getDB().sets.find(s => s.id === setId);
            if (!isMyPublished(set, auth)) return;
            if (getSettings().autoPublish === false) return;
            showToast('Updating your shared link…');
            try {
                await queuePublish(setId);
                showToast('Shared link updated ✓');
            } catch (e) {
                showToast('Saved here, but the shared copy was not updated: ' + (e.message || 'unknown error'), true);
            }
        }

        async function saveDisplayName() {
            const input = document.getElementById('acct-name');
            const st = document.getElementById('acct-name-status');
            const name = input.value.trim().slice(0, 60);
            const settings = getSettings();
            settings.displayName = name;
            saveSettings(settings);
            st.className = 'text-xs text-slate-500 mt-2';
            st.textContent = 'Saved.';
            const auth = ghGetAuth();
            const mine = getDB().sets.filter(s => isMyPublished(s, auth));
            if (!mine.length) return;
            const n = mine.length;
            st.textContent = 'Saved. Updating ' + n + ' shared set' + (n > 1 ? 's' : '') + '…';
            let failed = 0;
            for (const s of mine) {
                try { await queuePublish(s.id); } catch (e) { failed++; }
            }
            if (failed) {
                st.className = 'text-xs font-semibold text-red-500 mt-2';
                st.textContent = 'Saved, but ' + failed + ' shared set' + (failed > 1 ? 's' : '') + ' could not be updated. Open Share on that set and press Update to retry.';
            } else {
                st.textContent = 'Saved. Your shared set' + (n > 1 ? 's' : '') + ' now show' + (n > 1 ? '' : 's') + ' this name.';
            }
        }

        function renderAccount() {
            const settings = getSettings();
            const auth = ghGetAuth();
            const note = shareNote; shareNote = '';
            const card = 'bg-white dark:bg-[#181632] p-6 rounded-3xl border border-qBorderLight dark:border-qBorderDark shadow-sm';
            const noteHtml = note ? `<div class="bg-green-50 dark:bg-green-950/30 text-green-700 dark:text-green-400 text-xs font-semibold p-3 rounded-xl">${escapeHtml(note)}</div>` : '';
            const published = auth ? getDB().sets.filter(s => isMyPublished(s, auth)) : [];

            const publishedHtml = published.length ? published.map(s => {

                return `
                    <div class="flex items-center justify-between gap-3 py-2 border-t border-qBorderLight dark:border-qBorderDark first:border-0">
                        <div class="min-w-0">

                            <div class="text-[11px] font-mono text-slate-400 truncate">${escapeHtml(link)}</div>
                        </div>
                        <button onclick="copyLink('${s.id}')" class="shrink-0 px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 font-bold rounded-lg text-xs">Copy link</button>
                    </div>`;
            }).join('') : `<p class="text-xs text-slate-400">Nothing published yet. Open a set and press 🔗 Share.</p>`;

            const githubHtml = auth ? `
                <p class="text-sm">Connected as <b>${escapeHtml(auth.login)}</b>.</p>
                <label class="flex items-start gap-2 text-sm cursor-pointer">
                    <input type="checkbox" ${settings.autoPublish !== false ? 'checked' : ''} onchange="setAutoPublish(this.checked)" class="mt-1">
                    <span><b>Update shared sets automatically when I save them.</b><br><span class="text-xs text-slate-400">Applies to sets you have already published. The link never changes.</span></span>

                : `<p class="text-xs text-slate-500">Connect GitHub once to publish sets as links you can keep updating.</p>${connectHtml('')}`;

            return `

                        <div class="flex gap-2">

                            <button onclick="saveDisplayName()" class="px-4 bg-qBlue text-white font-bold rounded-xl text-sm">Save</button>

                    </div>
                    <div class="${card} space-y-3">
                        <h2 class="text-lg font-black">GitHub sharing</h2>

                    </div>
                    ${auth ? `<div class="${card}"><h2 class="text-lg font-black mb-2">Published sets</h2>${publishedHtml}</div>` : ''}

        async function doPublish(setId) {
            const btn = document.getElementById('pub-btn');
            const st = document.getElementById('pub-status');
            const alias = document.getElementById('pub-alias').value;
            btn.disabled = true; btn.classList.add('opacity-50');
            st.className = 'text-xs text-slate-500';
            st.textContent = 'Publishing…';
            try {
                const was = !!(getDB().sets.find(s => s.id === setId) || {}).gist;
                await publishSetToGist(setId, alias);
                shareNote = was ? 'Updated! The same link now shows your latest changes.' : 'Published! Copy the link below and send it.';
                shareSetCode(setId);
            } catch (e) {
                st.className = 'text-xs font-semibold text-red-500';
                st.textContent = e.message || 'Something went wrong.';
                btn.disabled = false; btn.classList.remove('opacity-50');
            }
        }

        function shareSetCode(setId) {
            const set = getDB().sets.find(s => s.id === setId);
            if (!set) return;
            const auth = ghGetAuth();
            const g = set.gist || null;
            const mine = !!(auth && (!g || (g.owner && g.owner.toLowerCase() === auth.login.toLowerCase())));
            const note = shareNote; shareNote = '';
            const noteHtml = note ? `<div class="bg-green-50 dark:bg-green-950/30 text-green-700 dark:text-green-400 text-xs font-semibold p-2 rounded-xl">${escapeHtml(note)}</div>` : '';

            // A set someone else published to you: show its link + update button
            if (g && !mine) {
                const link = buildShareLink(g.alias || g.id, g.alias ? g.owner : null);
                const html = `<div class="space-y-3">${linkBoxHtml(link, 'Link to this set')}
                    <button onclick="closeModal(); refreshLinkedSet('${set.id}')" class="w-full bg-qBlue text-white font-bold py-2.5 rounded-xl text-sm">↻ Check for updates</button></div>`;
                showModal('Shared set', 'Published by ' + (g.owner || 'someone else') + '. Opening the link again pulls their latest changes.', null, html);
                return;
            }

            if (!auth) {
                showModal('Publish this set', 'Get a link anyone can open. When you edit the set later, the same link shows the new version. One-time setup:', null,
                    connectHtml(set.id) + `<button onclick="legacyShareCode('${set.id}')" class="w-full text-[11px] text-slate-400 hover:text-qBlue underline pt-3">Skip, give me an offline code instead</button>`);
                return;
            }

            const link = g ? buildShareLink(g.alias || g.id, g.owner || auth.login) : '';
            const localWarn = location.protocol === 'file:'
                ? `<div class="bg-amber-50 dark:bg-amber-950/30 text-amber-700 dark:text-amber-400 text-xs p-2 rounded-xl">You are running a local copy. The link only works once this file is uploaded to your GitHub Pages site, so open the app from its GitHub Pages address and share from there.</div>` : '';
            const html = `
                <div class="space-y-3">
                    ${noteHtml}${localWarn}
                    ${g ? linkBoxHtml(link, 'Your link') : ''}
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Short code (optional)</label>
                        <input id="pub-alias" maxlength="24" value="${escapeHtml((g && g.alias) || '')}" placeholder="e.g. bio101" class="w-full bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl text-xs outline-none select-text">
                        <p class="text-[11px] text-slate-400 mt-1">2–24 letters, numbers or dashes. Makes the link much shorter.</p>
                    </div>
                    <button id="pub-btn" onclick="doPublish('${set.id}')" class="w-full bg-qBlue text-white font-bold py-2.5 rounded-xl text-sm">${g ? 'Update published set' : 'Publish set'}</button>
                    <p id="pub-status" class="text-xs text-slate-500">${g ? 'Press Update after you edit the set. The link stays the same.' : ''}</p>
                    <div class="text-[11px] text-slate-400">Signed in as ${escapeHtml(auth.login)} · <button onclick="openPublishSetup()" class="underline">Account</button> · <button onclick="legacyShareCode('${set.id}')" class="underline">Offline code</button></div>
                </div>`;
            showModal(g ? 'Share this set' : 'Publish this set', g ? 'Anyone with the link can open this set.' : 'Creates a link anyone can open. You can update it later and the link stays the same.', null, html);
        }

        // Old-style offline code (long text, no GitHub needed)
        function legacyShareCode(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set) return;
            const code = btoa(encodeURIComponent(JSON.stringify(set)));
            const html = `<textarea readonly class="w-full h-28 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs font-mono select-all">${code}</textarea>`;
            showModal('Offline Share Code', 'Copy this long code to send to friends. It does not update after sending.', null, html);
        }

        function openShareCodeModal() {
            const html = `
                <textarea id="import-code-input" placeholder="Paste a link, short code, or offline code..." class="w-full h-28 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs font-mono outline-none mb-2 select-text"></textarea>
                <button onclick="importFromShareCode()" class="w-full bg-qBlue text-white font-bold py-2 rounded-xl text-sm">Open Set</button>
            `;
            showModal('Open a Link or Code', 'Paste a QuizIt link, a short code (like username/bio101), or an offline share code.', null, html);
        }

        function importFromShareCode() {
            const input = document.getElementById('import-code-input').value.trim();
            if (!input) return;
            const link = input.length < 300 ? parseLinkToken(input) : null;
            if (link) { closeModal(); openLinkedSet(link); return; }
            try {
                const set = JSON.parse(decodeURIComponent(atob(input)));
                if (!set || !set.title || !Array.isArray(set.terms)) throw new Error();
                const clean = sanitizeSet(set, safeId(set.id, 'set_' + Date.now()), false);
                const db = getDB();
                if (!db.sets.some(s => s.id === clean.id)) {
                    db.sets.push(clean);
                    saveDB(db);
                }
                closeModal();
                showModal('Success', 'Study set imported successfully!');
                window.router.navigate('library');
            } catch (err) {
                showModal('Error', 'That does not look like a valid QuizIt link or code.');
            }
        }

        function exportSetJson(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(set, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `${set.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_quizit.json`);
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function exportAllData() {
            const db = getDB();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "quizit_backup_" + Date.now() + ".json");
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function openAdvancedImportModal() {
            const html = `
                <div class="space-y-4">
                    <div class="flex border-b border-qBorderLight dark:border-qBorderDark text-xs font-bold">
                        <button onclick="switchImportTab('text')" id="itab-text" class="flex-1 py-2 border-b-2 border-qBlue text-qBlue">Paste Text / Quizlet</button>
                        <button onclick="switchImportTab('file')" id="itab-file" class="flex-1 py-2 text-slate-400">JSON File</button>
                    </div>
                    <div id="import-pane-text" class="space-y-3">
                        <p class="text-xs text-slate-500">Paste terms and definitions from Word, Excel, or Quizlet.</p>
                        <input type="text" id="import-set-title-input" placeholder="Set Title (Optional)" class="w-full bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl text-xs outline-none">
                        <textarea id="import-raw-textarea" placeholder="Term 1 \t Definition 1&#10;Term 2 \t Definition 2" class="w-full h-32 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs font-mono outline-none"></textarea>
                        <div class="flex gap-2">
                            <select id="import-separator" class="bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-xs outline-none flex-1">
                                <option value="auto">Auto-detect Separator</option>
                                <option value="tab">Tab (\\t)</option>
                                <option value="comma">Comma (,)</option>
                                <option value="dash">Dash (-)</option>
                            </select>
                            <button onclick="processTextImport()" class="bg-qBlue text-white font-bold px-4 py-2 rounded-xl text-xs">Import Text</button>
                        </div>
                    </div>
                    <div id="import-pane-file" class="space-y-3 hidden">
                        <p class="text-xs text-slate-500">Upload a QuizIt JSON backup file.</p>
                        <input type="file" id="import-file-input" accept=".json" class="w-full text-xs text-slate-500">
                        <button onclick="processImportFile()" class="w-full bg-qBlue text-white font-bold py-2 rounded-xl text-sm">Upload & Import</button>
                    </div>
                </div>
            `;
            showModal('Advanced Import', 'Choose your import source.', null, html);
        }

        function switchImportTab(tab) {
            const tText = document.getElementById('itab-text');
            const tFile = document.getElementById('itab-file');
            const pText = document.getElementById('import-pane-text');
            const pFile = document.getElementById('import-pane-file');
            if (tab === 'text') {
                tText.className = 'flex-1 py-2 border-b-2 border-qBlue text-qBlue font-bold';
                tFile.className = 'flex-1 py-2 text-slate-400';
                pText.classList.remove('hidden');
                pFile.classList.add('hidden');
            } else {
                tFile.className = 'flex-1 py-2 border-b-2 border-qBlue text-qBlue font-bold';
                tText.className = 'flex-1 py-2 text-slate-400';
                pFile.classList.remove('hidden');
                pText.classList.add('hidden');
            }
        }

        function processTextImport() {
            const titleVal = document.getElementById('import-set-title-input').value.trim() || 'Imported Set ' + new Date().toLocaleDateString();
            const rawText = document.getElementById('import-raw-textarea').value.trim();
            const sepMode = document.getElementById('import-separator').value;
            if (!rawText) {
                showModal('Error', 'Paste some terms and definitions first.');
                return;
            }

            const lines = rawText.split('\n');
            const terms = [];
            lines.forEach((line) => {
                if (!line.trim()) return;
                let parts = [];
                if (sepMode === 'tab') parts = line.split('\t');
                else if (sepMode === 'comma') parts = line.split(',');
                else if (sepMode === 'dash') parts = line.split(' - ');
                else {
                    if (line.includes('\t')) parts = line.split('\t');
                    else if (line.includes(' - ')) parts = line.split(' - ');
                    else if (line.includes(',')) parts = line.split(',');
                    else parts = [line, ''];
                }

                if (parts.length >= 2) {
                    terms.push({
                        id: 't_' + Math.random(),
                        term: parts[0].trim(),
                        definition: parts.slice(1).join(' ').trim(),
                        image: '',
                        imageSide: 'back',
                        starred: false
                    });
                }
            });

            if (terms.length === 0) {
                showModal('Error', 'Could not parse any valid term-definition pairs.');
                return;
            }

            const db = getDB();
            const newSet = {
                id: 'set_' + Date.now(),
                title: titleVal,
                description: 'Imported via text paste',
                folderId: '',
                createdAt: Date.now(),
                terms
            };
            db.sets.push(newSet);
            saveDB(db);
            closeModal();
            showModal('Success', `Successfully imported ${terms.length} terms!`);
            window.router.navigate('study', { setId: newSet.id });
        }

        function processImportFile() {
            const fileInput = document.getElementById('import-file-input');
            if (!fileInput.files.length) return;
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    const db = getDB();
                    if (parsed.sets && Array.isArray(parsed.sets)) {
                        db.sets = [...db.sets, ...parsed.sets.map(s => sanitizeSet(s, safeId(s && s.id, 'set_' + Math.random().toString(36).slice(2, 10)), true))];
                        if (Array.isArray(parsed.folders)) db.folders = [...db.folders, ...parsed.folders.map(sanitizeFolder)];
                    } else if (parsed.title && Array.isArray(parsed.terms)) {
                        db.sets.push(sanitizeSet(parsed, safeId(parsed.id, 'set_' + Date.now()), true));
                    }
                    saveDB(db);
                    closeModal();
                    showModal('Success', 'Data imported successfully!');
                    window.router.navigate('library');
                } catch (err) {
                    showModal('Error', 'Invalid JSON structure.');
                }
            };
            reader.readAsText(file);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const settings = getSettings();
            applyTheme(settings.darkMode);
            window.router.navigate('dashboard');
            handleLinkHash();
            window.addEventListener('hashchange', handleLinkHash);
            document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastSyncAt > 60000) syncLinkedSets(); });
        });
    </script>
</body>
</html>
