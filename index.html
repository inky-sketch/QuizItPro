<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizIt Pro - Study Smarter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        qBlue: '#4255ff',
                        qCyan: '#3ccfcf',
                        qDark: '#0a092d',
                        qLightBg: '#f6f7fb',
                        qDarkBg: '#13122b',
                        qCardLight: '#ffffff',
                        qCardDark: '#1e1c3a',
                        qBorderLight: '#d9dde8',
                        qBorderDark: '#2e2b58',
                        qGreen: '#23b26d',
                        qRed: '#ff7777'
                    }
                }
            }
        }
    </script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { 
            -webkit-backface-visibility: hidden !important;
            backface-visibility: hidden !important; 
        }
        .rotate-y-180 { transform: rotateY(180deg); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-qLightBg dark:bg-qDarkBg text-slate-800 dark:text-slate-100 min-h-screen flex font-sans select-none transition-colors duration-200">

    <aside id="sidebar" class="w-64 bg-white dark:bg-[#181632] border-r border-qBorderLight dark:border-qBorderDark flex flex-col fixed inset-y-0 left-0 z-40 transition-transform -translate-x-full md:translate-x-0">
        <div class="p-6 flex items-center justify-between border-b border-qBorderLight dark:border-qBorderDark">
            <h1 onclick="window.router.navigate('dashboard')" class="text-2xl font-black text-qBlue tracking-wider cursor-pointer flex items-center gap-2">
                QuizIt <span class="text-[10px] bg-qBlue text-white px-1.5 py-0.5 rounded font-mono">PRO</span>
            </h1>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-qBlue">✕</button>
        </div>

        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <button onclick="window.router.navigate('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition nav-btn" data-view="dashboard">
                🏠 Home
            </button>
            <button onclick="window.router.navigate('library')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition nav-btn" data-view="library">
                📚 Library & Sets
            </button>
            <button onclick="window.router.navigate('folders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition nav-btn" data-view="folders">
                📁 Folders
            </button>
            <button onclick="window.router.navigate('creator')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition nav-btn text-qBlue" data-view="creator">
                ➕ Create New Set
            </button>
            <button onclick="window.router.navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition nav-btn" data-view="account">
                👤 Account
            </button>
        </nav>

        <div class="p-4 border-t border-qBorderLight dark:border-qBorderDark space-y-2">
            <div class="flex items-center justify-between px-3 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl text-xs font-semibold">
                <span>Dark Mode</span>
                <button onclick="toggleDarkMode()" id="dark-mode-btn" class="px-3 py-1 bg-qBlue text-white rounded-lg transition shadow-sm">Toggle</button>
            </div>
            <div class="flex gap-2">
                <button onclick="openAdvancedImportModal()" class="flex-1 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold py-2 rounded-xl transition text-center">Import</button>
                <button onclick="openShareCodeModal()" class="flex-1 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold py-2 rounded-xl transition text-center">Open Link/Code</button>
            </div>
            <button onclick="exportAllData()" class="w-full text-xs bg-red-50 dark:bg-red-950/30 text-red-500 font-semibold py-2 rounded-xl transition text-center">Backup All Data</button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col md:ml-64 min-h-screen">
        <header class="bg-white/80 dark:bg-[#181632]/80 backdrop-blur-md border-b border-qBorderLight dark:border-qBorderDark h-16 px-6 flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-xl p-2">☰</button>
                <div class="relative w-48 sm:w-80">
                    <input type="text" id="global-search" oninput="handleGlobalSearch(this.value)" placeholder="Search sets, terms..." class="w-full bg-slate-100 dark:bg-slate-800 border border-qBorderLight dark:border-qBorderDark rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-qBlue outline-none transition">
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.router.navigate('creator')" class="bg-qBlue hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm">+ Create</button>
            </div>
        </header>

        <main id="app" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto">
            <!-- Dynamic Content -->
        </main>
    </div>

    <div id="custom-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <h3 id="modal-title" class="text-xl font-black">Notice</h3>
            <p id="modal-msg" class="text-sm text-slate-500 dark:text-slate-400"></p>
            <div id="modal-custom-content"></div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="modal-cancel-btn" onclick="closeModal()" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 font-semibold rounded-xl text-sm hover:bg-slate-200">Cancel</button>
                <button id="modal-ok-btn" onclick="closeModal()" class="px-4 py-2 bg-qBlue text-white font-bold rounded-xl text-sm hover:bg-blue-700">OK</button>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }

        const DB_KEY = 'quizit_master_db_v2';
        const SETTINGS_KEY = 'quizit_settings_v2';

        function getDB() {
            let data = localStorage.getItem(DB_KEY);
            if (!data) {
                const initial = {
                    sets: [
                        {
                            id: 'set_sample_1',
                            title: 'Web Development Basics',
                            description: 'Core concepts of HTML, CSS, and JavaScript for beginners.',
                            folderId: 'folder_dev',
                            createdAt: Date.now(),
                            terms: [
                                { id: 't1', term: 'HTML', definition: 'HyperText Markup Language; structures web pages.', image: '', imageSide: 'back', starred: true },
                                { id: 't2', term: 'CSS', definition: 'Cascading Style Sheets; styles the visual presentation.', image: '', imageSide: 'back', starred: false },
                                { id: 't3', term: 'JavaScript', definition: 'Programming language for adding interactive behavior.', image: '', imageSide: 'back', starred: true }
                            ]
                        }
                    ],
                    folders: [
                        { id: 'folder_dev', title: 'Programming & Tech' }
                    ]
                };
                localStorage.setItem(DB_KEY, JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(data);
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function getSettings() {
            let s = localStorage.getItem(SETTINGS_KEY);
            if (!s) {
                const def = { darkMode: false };
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(def));
                return def;
            }
            return JSON.parse(s);
        }

        function saveSettings(settings) {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        }

        function showModal(title, msg, onOk = null, customHtml = '') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal-custom-content').innerHTML = customHtml;
            const okBtn = document.getElementById('modal-ok-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            
            if (onOk) {
                cancelBtn.classList.remove('hidden');
                okBtn.onclick = () => { closeModal(); onOk(); };
            } else {
                cancelBtn.classList.add('hidden');
                okBtn.onclick = closeModal;
            }
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            document.getElementById('custom-modal').classList.remove('flex');
        }

        function toggleDarkMode() {
            const settings = getSettings();
            settings.darkMode = !settings.darkMode;
            saveSettings(settings);
            applyTheme(settings.darkMode);
        }

        function applyTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        const router = {
            currentView: 'dashboard',
            params: {},
            navigate(view, params = {}) {
                this.currentView = view;
                this.params = params;
                window.scrollTo(0,0);
                
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.getAttribute('data-view') === view) {
                        btn.classList.add('bg-blue-50', 'dark:bg-slate-800', 'text-qBlue');
                    } else {
                        btn.classList.remove('bg-blue-50', 'dark:bg-slate-800', 'text-qBlue');
                    }
                });

                const app = document.getElementById('app');
                switch(view) {
                    case 'dashboard': app.innerHTML = renderDashboard(); break;
                    case 'library': app.innerHTML = renderLibrary(); break;
                    case 'folders': app.innerHTML = renderFolders(); break;
                    case 'creator': app.innerHTML = renderCreator(params.setId); initCreatorForm(params.setId); break;
                    case 'study': app.innerHTML = renderStudyHub(params.setId); break;
                    case 'flashcards': app.innerHTML = renderFlashcards(params.setId); initFlashcardsEngine(params.setId); break;
                    case 'learn': app.innerHTML = renderLearn(params.setId); initLearnEngine(params.setId); break;
                    case 'test': app.innerHTML = renderTest(params.setId); initTestEngine(params.setId); break;
                    case 'match': app.innerHTML = renderMatch(params.setId); initMatchEngine(params.setId); break;
                    case 'blast': app.innerHTML = renderBlast(params.setId); initBlastEngine(params.setId); break;
                    case 'blocks': app.innerHTML = renderBlocks(params.setId); initBlocksEngine(params.setId); break;
                    case 'memory': app.innerHTML = renderMemory(params.setId); initMemoryEngine(params.setId); break;
                    case 'account': app.innerHTML = renderAccount(); break;
                    default: app.innerHTML = renderDashboard();
                }
            }
        };
        window.router = router;

        function renderDashboard() {
            const db = getDB();
            const recentSets = [...db.sets].sort((a,b) => b.createdAt - a.createdAt).slice(0, 6);
            return `
                <div class="space-y-8 pb-16">
                    <div class="bg-gradient-to-r from-qBlue to-indigo-600 rounded-3xl p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
                        <div class="space-y-2">
                            <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">Welcome</span>
                            <h1 class="text-3xl font-black">Ready to study?</h1>
                            <p class="text-white/80 text-sm">Select a study set or create a new one instantly.</p>
                        </div>
                        <button onclick="window.router.navigate('creator')" class="bg-white text-qBlue font-extrabold px-6 py-3 rounded-2xl shadow-lg hover:bg-slate-100 transition shrink-0">+ Create Study Set</button>
                    </div>

                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-black">Recent Study Sets</h2>
                            <button onclick="window.router.navigate('library')" class="text-xs font-bold text-qBlue hover:underline">View All &rarr;</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${recentSets.length === 0 ? `<p class="text-sm text-slate-400">No study sets found.</p>` : recentSets.map(set => `
                                <div onclick="window.router.navigate('study', {setId: '${set.id}'})" class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-2xl p-6 hover:shadow-lg transition cursor-pointer flex flex-col justify-between group">
                                    <div>
                                        <div class="flex justify-between items-start mb-3">
                                            <span class="text-xs font-bold uppercase tracking-wider bg-blue-50 dark:bg-blue-950/40 text-qBlue px-2.5 py-1 rounded-md">${set.terms.length} terms</span>
                                            <span class="text-xs text-slate-400">📁 ${getFolderName(set.folderId)}</span>
                                        </div>
                                        <h3 class="text-lg font-bold group-hover:text-qBlue transition mb-1 line-clamp-1">${escapeHtml(set.title)}</h3>
                                        ${set.author ? `<p class="text-[11px] font-bold text-qBlue mb-1">by ${escapeHtml(set.author)}</p>` : ''}<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4">${escapeHtml(set.description || 'No description.')}</p>
                                    </div>
                                    <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800 text-xs font-semibold text-qBlue">
                                        <span>Study Now</span>
                                        <span>&rarr;</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function getFolderName(id) {
            const db = getDB();
            const f = db.folders.find(x => x.id === id);
            return f ? f.title : 'Unsorted';
        }

        function renderLibrary() {
            const db = getDB();
            return `
                <div class="space-y-6 pb-16">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-[#181632] p-6 rounded-3xl border border-qBorderLight dark:border-qBorderDark shadow-sm">
                        <div>
                            <h1 class="text-2xl font-black">Your Library</h1>
                            <p class="text-sm text-slate-500">All your flashcard sets in one place.</p>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto">
                            <input type="text" oninput="filterLibrarySets(this.value)" placeholder="Filter sets..." class="bg-slate-50 dark:bg-slate-800 border border-qBorderLight dark:border-qBorderDark px-4 py-2 rounded-xl text-sm outline-none w-full sm:w-64">
                        </div>
                    </div>

                    <div id="library-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${db.sets.map(set => libraryCardHtml(set)).join('')}
                    </div>
                </div>
            `;
        }

        function libraryCardHtml(set) {
            return `
                <div class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-2xl p-6 hover:shadow-lg transition flex flex-col justify-between group">
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold uppercase tracking-wider bg-blue-50 dark:bg-blue-950/40 text-qBlue px-2.5 py-1 rounded-md">${set.terms.length} terms</span>
                            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                                <button onclick="window.router.navigate('creator', {setId: '${set.id}'})" class="p-1 hover:text-qBlue">✏️</button>
                                <button onclick="shareSetCode('${set.id}')" class="p-1 hover:text-qBlue" title="Share link">🔗</button>
                                <button onclick="deleteSet('${set.id}')" class="p-1 hover:text-red-500">🗑️</button>
                            </div>
                        </div>
                        <h3 onclick="window.router.navigate('study', {setId: '${set.id}'})" class="text-lg font-bold group-hover:text-qBlue cursor-pointer transition mb-1 line-clamp-1">${escapeHtml(set.title)}</h3>
                        ${set.author ? `<p class="text-[11px] font-bold text-qBlue mb-1">by ${escapeHtml(set.author)}</p>` : ''}<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4">${escapeHtml(set.description || 'No description.')}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="window.router.navigate('study', {setId: '${set.id}'})" class="flex-1 bg-slate-100 dark:bg-slate-800 hover:bg-qBlue hover:text-white font-semibold py-2 rounded-xl text-xs transition text-center">Study</button>
                        <button onclick="exportSetJson('${set.id}')" class="px-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 font-semibold py-2 rounded-xl text-xs transition">💾</button>
                    </div>
                </div>
            `;
        }

        function filterLibrarySets(query) {
            const db = getDB();
            const filtered = db.sets.filter(s => s.title.toLowerCase().includes(query.toLowerCase()) || (s.description && s.description.toLowerCase().includes(query.toLowerCase())));
            const grid = document.getElementById('library-grid');
            grid.innerHTML = filtered.length === 0 ? `<p class="text-sm text-slate-400 col-span-full">No matching sets.</p>` : filtered.map(s => libraryCardHtml(s)).join('');
        }

        function deleteSet(id) {
            showModal('Confirm Deletion', 'Delete this study set? This action is permanent.', () => {
                const db = getDB();
                db.sets = db.sets.filter(s => s.id !== id);
                saveDB(db);
                window.router.navigate('library');
            });
        }

        function renderFolders() {
            const db = getDB();
            return `
                <div class="space-y-6 pb-16">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-[#181632] p-6 rounded-3xl border border-qBorderLight dark:border-qBorderDark shadow-sm">
                        <div>
                            <h1 class="text-2xl font-black">Folders</h1>
                            <p class="text-sm text-slate-500">Organize your study sets into groups.</p>
                        </div>
                        <button onclick="createNewFolderPrompt()" class="bg-qBlue hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm">+ New Folder</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${db.folders.length === 0 ? `<p class="text-sm text-slate-400">No folders created yet.</p>` : db.folders.map(f => {
                            const setNum = db.sets.filter(s => s.folderId === f.id).length;
                            return `
                                <div class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-2xl p-6 flex items-center justify-between shadow-sm hover:shadow-md transition">
                                    <div>
                                        <h3 class="font-bold text-base mb-1">📁 ${escapeHtml(f.title)}</h3>
                                        <span class="text-xs text-slate-400">${setNum} sets inside</span>
                                    </div>
                                    <button onclick="deleteFolder('${f.id}')" class="text-slate-400 hover:text-red-500 p-2">🗑️</button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function createNewFolderPrompt() {
            const html = `<input type="text" id="new-folder-title-input" placeholder="Folder Title" class="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs outline-none">`;
            showModal('Create Folder', 'Enter title for the folder.', () => {
                const title = document.getElementById('new-folder-title-input').value.trim();
                if (title) {
                    const db = getDB();
                    db.folders.push({ id: 'folder_' + Date.now(), title });
                    saveDB(db);
                    window.router.navigate('folders');
                }
            }, html);
        }

        function deleteFolder(id) {
            showModal('Delete Folder', 'Remove folder? Sets inside will be moved to Unsorted.', () => {
                const db = getDB();
                db.folders = db.folders.filter(f => f.id !== id);
                db.sets.forEach(s => { if (s.folderId === id) s.folderId = ''; });
                saveDB(db);
                window.router.navigate('folders');
            });
        }

        let currentEditingSetId = null;
        let editorTerms = [];

        function renderCreator(setId = null) {
            currentEditingSetId = setId;
            return `
                <div class="max-w-4xl mx-auto space-y-6 pb-16">
                    <div class="flex justify-between items-center bg-white dark:bg-[#181632] p-6 rounded-3xl border border-qBorderLight dark:border-qBorderDark shadow-sm">
                        <h1 class="text-2xl font-black">${setId ? 'Edit Study Set' : 'Create New Study Set'}</h1>
                        <button onclick="saveStudySet()" class="bg-qBlue hover:bg-blue-700 text-white font-extrabold px-6 py-2.5 rounded-xl text-sm transition shadow-md">Save Set</button>
                    </div>

                    <div class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-3xl p-6 space-y-4 shadow-sm">
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Title</label>
                            <input type="text" id="set-title" placeholder="e.g. Biology - Chapter 1 Cell Structure" class="w-full bg-slate-50 dark:bg-slate-800 border border-qBorderLight dark:border-qBorderDark rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-qBlue">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-1">

                    }));

                    { id: 't_' + Math.random(), term: '', definition: '', image: '', imageSide: 'back', starred: false },

        function handleSuggestions(el, type, id) {
            const query = el.value.trim().toLowerCase();
            const box = document.getElementById(`sug-${type}-${id}`);
            if (!box) return;
            if (query.length < 2) {
                box.classList.add('hidden');
                return;
            }
            const db = getDB();
            let matches = [];
            db.sets.forEach(s => {
                s.terms.forEach(t => {
                    const val = type === 'term' ? t.term : t.definition;
                    if (val.toLowerCase().includes(query) && !matches.includes(val)) {
                        matches.push(val);
                    }
                });
            });
            matches = matches.slice(0, 3);
            if (matches.length === 0) {
                box.classList.add('hidden');
                return;
            }
            box.innerHTML = matches.map(m => `
                <div onclick="applySuggestion('${id}', '${type}', \`${escapeHtml(m)}\`)" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer text-xs font-semibold truncate">
                    ${escapeHtml(m)}
                </div>
            `).join('');
            box.classList.remove('hidden');
        }

        function applySuggestion(id, type, value) {
            const field = type === 'term' ? 'term' : 'definition';
            updateEditorTerm(id, field, value);
            renderEditorCards();
        }

        function addEditorCard() {
            editorTerms.push({ id: 't_' + Math.random(), term: '', definition: '', image: '', imageSide: 'back', starred: false });
            renderEditorCards();

        function removeEditorCard(id) {
            if (editorTerms.length <= 1) {
                showModal('Notice', 'A set must contain at least one card.');
                return;
            }
            editorTerms = editorTerms.filter(t => t.id !== id);
            renderEditorCards();
        }

        function updateEditorTerm(id, field, val) {
            const item = editorTerms.find(t => t.id === id);
            if (item) item[field] = val;
        }

        function processCreatorTextImport() {
            const raw = document.getElementById('creator-import-textarea').value.trim();
            const sep = document.getElementById('creator-import-sep').value;
            if (!raw) return;
            const lines = raw.split('\n');
            let added = 0;
            lines.forEach(line => {
                if (!line.trim()) return;
                let parts = [];
                if (sep === 'tab') parts = line.split('\t');
                else if (sep === 'comma') parts = line.split(',');
                else if (sep === 'dash') parts = line.split(' - ');
                else {
                    if (line.includes('\t')) parts = line.split('\t');
                    else if (line.includes(' - ')) parts = line.split(' - ');
                    else if (line.includes(',')) parts = line.split(',');
                    else parts = [line, ''];
                }
                if (parts.length >= 2) {
                    editorTerms.push({
                        id: 't_' + Math.random(),
                        term: parts[0].trim(),
                        definition: parts.slice(1).join(' ').trim(),
                        image: '',
                        imageSide: 'back',
                        starred: false
                    });
                    added++;
                }
            });
            if (added > 0) {
                renderEditorCards();
                document.getElementById('creator-import-box').classList.add('hidden');
                document.getElementById('creator-import-textarea').value = '';
            } else {
                showModal('Error', 'No valid term-definition pairs found.');
            }
        }

        function handleImageUpload(e, id) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                updateEditorTerm(id, 'image', evt.target.result);
                renderEditorCards();
            };
            reader.readAsDataURL(file);
        }

        function saveStudySet() {
            const title = document.getElementById('set-title').value.trim();
            const description = document.getElementById('set-desc').value.trim();
            const folderId = document.getElementById('set-folder').value;

            if (!title) {
                showModal('Error', 'Please enter a title for the study set.');
                return;
            }

            const validTerms = editorTerms.filter(t => t.term.trim() !== '' || t.definition.trim() !== '');
            if (validTerms.length === 0) {
                showModal('Error', 'Please add at least one valid term and definition.');
                return;
            }

            const db = getDB();
            const setId = currentEditingSetId || 'set_' + Date.now();
            const existingIndex = db.sets.findIndex(s => s.id === setId);

            const setObj = {
                id: setId,
                title,
                description,
                folderId,
                createdAt: existingIndex >= 0 ? db.sets[existingIndex].createdAt : Date.now(),
                ...(existingIndex >= 0 && db.sets[existingIndex].gist ? { gist: db.sets[existingIndex].gist } : {}),
                ...(existingIndex >= 0 && db.sets[existingIndex].author ? { author: db.sets[existingIndex].author } : {}),
                terms: validTerms.map(t => ({
                    id: t.id || 't_' + Math.random(),
                    term: t.term.trim(),
                    definition: t.definition.trim(),
                    image: t.image || '',
                    imageSide: t.imageSide || 'back',
                    starred: t.starred || false
                }))
            };

            if (existingIndex >= 0) {
                db.sets[existingIndex] = setObj;
            } else {
                db.sets.push(setObj);
            }

            saveDB(db);
            window.router.navigate('study', { setId });
            autoPublishIfLinked(setId);
        }

        function initFlashcardsEngine(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set) return;
            fcState.set = set;
            fcState.originalCards = [...set.terms];
            fcState.cards = [...set.terms];
            fcState.index = 0;
            fcState.flipped = false;
            fcState.swapRoles = false;
            fcState.mode = 'review';
            fcState.isShuffled = false;

            setFcMode('review');
            updateFlashcardUI();

            window.onkeydown = function(e) {
                if (window.router.currentView !== 'flashcards') return;
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                    e.preventDefault();
                    flipFlashcard();
                } else if (e.code === 'ArrowRight') {
                    if (fcState.mode === 'assess') markFcCard(true);

        function toggleFcShuffle() {
            fcState.isShuffled = !fcState.isShuffled;

            if (fcState.isShuffled) {

                btn.innerText = "🔀 Shuffle";
                btn.classList.remove('bg-qBlue', 'text-white');
                fcState.cards = [...fcState.originalCards];
            }
            fcState.index = 0;
            fcState.flipped = false;
            updateFlashcardUI();
        }

        function navigateFc(step) {
            if (fcState.cards.length === 0) return;
            fcState.index = (fcState.index + step + fcState.cards.length) % fcState.cards.length;
            fcState.flipped = false;
            updateFlashcardUI();
        }

        function toggleFcSwap() {
            fcState.swapRoles = document.getElementById('fc-swap').checked;
            updateFlashcardUI();
        }

        function resetFcSession() {
            fcState.cards = fcState.isShuffled ? [...fcState.originalCards].sort(() => Math.random() - 0.5) : [...fcState.originalCards];
            fcState.index = 0;
            fcState.flipped = false;
            updateFlashcardUI();
        }

        function markFcCard(know) {
            if (fcState.cards.length === 0) return;
            if (know) {
                fcState.cards.splice(fcState.index, 1);
            } else {
                fcState.index = (fcState.index + 1) % fcState.cards.length;
            }
            if (fcState.index >= fcState.cards.length) {
                fcState.index = 0;
            }
            fcState.flipped = false;
            updateFlashcardUI();
        }

        function updateFlashcardUI() {
            const inner = document.getElementById('fc-inner');
            if (fcState.cards.length === 0) {

                document.getElementById('fc-back').innerText = "You finished reviewing all cards.";
                document.getElementById('fc-counter').innerText = `0 / 0`;
                inner.classList.remove('transition-transform', 'duration-300');
                inner.style.transform = 'rotateY(0deg)';
                return;

            const c = fcState.cards[fcState.index];
            const termText = fcState.swapRoles ? c.definition : c.term;
            const defText = fcState.swapRoles ? c.term : c.definition;

            document.getElementById('fc-front-label').innerText = fcState.swapRoles ? "Definition" : "Term";
            document.getElementById('fc-back-label').innerText = fcState.swapRoles ? "Term" : "Definition";

            document.getElementById('fc-front').innerText = termText;
            document.getElementById('fc-back').innerText = defText;
            document.getElementById('fc-counter').innerText = `${fcState.index + 1} / ${fcState.cards.length}`;
            
            const side = c.imageSide || 'back';
            const showFrontImage = (side === 'front' && !fcState.swapRoles) || (side === 'back' && fcState.swapRoles);
            const showBackImage = (side === 'back' && !fcState.swapRoles) || (side === 'front' && fcState.swapRoles);

            document.getElementById('fc-front-img').innerHTML = (c.image && showFrontImage) ? `<img src="${c.image}" class="h-28 rounded-xl object-cover border border-qBorderLight dark:border-qBorderDark">` : '';
            document.getElementById('fc-back-img').innerHTML = (c.image && showBackImage) ? `<img src="${c.image}" class="h-28 rounded-xl object-cover border border-qBorderLight dark:border-qBorderDark">` : '';

            if (fcState.flipped) {
                inner.classList.add('transition-transform', 'duration-300');

            } else {
                inner.classList.remove('transition-transform', 'duration-300');

        let matchState = { set: null, items: [], selected: null, timer: 0, interval: null, playing: false, swapRoles: false, difficulty: 'normal' };

        function renderMatch(setId) {

                            </label>
                            <select id="match-diff" onchange="initMatchEngine('${setId}')" class="bg-slate-100 dark:bg-slate-800 p-1.5 rounded-lg border border-qBorderLight dark:border-qBorderDark outline-none">
                                <option value="easy">Easy (4 Pairs)</option>
                                <option value="normal" selected>Normal (6 Pairs)</option>
                                <option value="hard">Hard (8 Pairs)</option>
                            </select>
                        </div>
                        <span id="match-timer" class="text-lg font-black font-mono text-qBlue">0.0s</span>
                    </div>
                    <div id="match-board" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
                </div>
            `;

        function initMatchEngine(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set || set.terms.length === 0) return;
            matchState.set = set;

            const swap = document.getElementById('match-swap') ? document.getElementById('match-swap').checked : false;
            const diff = document.getElementById('match-diff') ? document.getElementById('match-diff').value : 'normal';

            let count = 6;
            if (diff === 'easy') count = 4;
            if (diff === 'hard') count = 8;

            const subset = [...set.terms].sort(() => Math.random() - 0.5).slice(0, count);
            let deck = [];
            subset.forEach(t => {
                deck.push({ id: t.id, text: swap ? t.definition : t.term, type: 'term', matched: false });
                deck.push({ id: t.id, text: swap ? t.term : t.definition, type: 'def', matched: false });
            });
            deck.sort(() => Math.random() - 0.5);

            matchState.items = deck;
            matchState.selected = null;
            matchState.timer = 0;
            matchState.playing = true;

            if (matchState.interval) clearInterval(matchState.interval);
            matchState.interval = setInterval(() => {
                if (!matchState.playing) return;
                matchState.timer += 0.1;
                document.getElementById('match-timer').innerText = matchState.timer.toFixed(1) + 's';
            }, 100);

            renderMatchBoard();
        }

        function renderMatchBoard() {
            const board = document.getElementById('match-board');
            if (matchState.items.every(i => i.matched)) {
                matchState.playing = false;
                clearInterval(matchState.interval);
                playSound('success');
                board.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white dark:bg-[#181632] rounded-3xl border border-qBorderLight dark:border-qBorderDark space-y-4">
                        <h2 class="text-2xl font-black">Finished in ${matchState.timer.toFixed(1)}s!</h2>
                        <button onclick="initMatchEngine('${matchState.set.id}')" class="bg-qBlue text-white font-bold px-6 py-2.5 rounded-xl text-sm">Play Again</button>
                    </div>
                `;
                return;
            }

            board.innerHTML = matchState.items.map((item, idx) => `
                <div onclick="selectMatchItem(${idx})" class="h-32 bg-white dark:bg-[#181632] border-2 ${item.matched ? 'opacity-0 pointer-events-none' : matchState.selected === idx ? 'border-qBlue bg-blue-50 dark:bg-slate-800' : 'border-qBorderLight dark:border-qBorderDark'} rounded-2xl p-4 flex items-center justify-center text-center cursor-pointer transition text-xs font-bold">
                    ${escapeHtml(item.text)}
                </div>
            `).join('');
        }

        function selectMatchItem(idx) {
            const clicked = matchState.items[idx];
            if (matchState.selected === null) {
                matchState.selected = idx;
                renderMatchBoard();
            } else if (matchState.selected === idx) {
                matchState.selected = null;
                renderMatchBoard();
            } else {
                const first = matchState.items[matchState.selected];
                if (first.id === clicked.id && first.type !== clicked.type) {
                    first.matched = true;
                    clicked.matched = true;
                    playSound('success');
                    matchState.selected = null;
                    renderMatchBoard();
                } else {

        let blastState = { set: null, activeAsteroids: [], score: 0, interval: null, canvas: null, ctx: null, running: false, swapRoles: false, speedMult: 1 };

        function renderBlast(setId) {
            return `
                <div class="max-w-4xl mx-auto space-y-4 pb-16 flex flex-col items-center">
                    <div class="w-full flex flex-wrap justify-between items-center bg-white dark:bg-[#181632] px-6 py-4 rounded-2xl border border-qBorderLight dark:border-qBorderDark shadow-sm gap-4">
                        <button onclick="window.router.navigate('study', {setId: '${setId}'})" class="text-xs font-bold text-qBlue uppercase tracking-wider hover:underline">&larr; Back</button>
                        <div class="flex items-center gap-3 text-xs font-bold">
                            <label class="flex items-center gap-1 cursor-pointer">
                                <input type="checkbox" id="blast-swap" onchange="initBlastEngine('${setId}')"> Swap Prompt/Answer
                            </label>
                            <select id="blast-diff" onchange="initBlastEngine('${setId}')" class="bg-slate-100 dark:bg-slate-800 p-1.5 rounded-lg border border-qBorderLight dark:border-qBorderDark outline-none">
                                <option value="0.5">Slow</option>

                    <div class="relative w-full bg-slate-900 rounded-3xl overflow-hidden border border-qBorderLight dark:border-qBorderDark shadow-2xl">

                        <div id="blast-input-bar" class="absolute bottom-4 left-4 right-4 flex gap-2">
                            <input type="text" id="blast-typing-input" onkeydown="handleBlastInput(event)" placeholder="Type answer & press Enter..." class="w-full bg-black/60 backdrop-blur-md border border-slate-700 text-white px-4 py-3 rounded-2xl text-sm outline-none focus:border-qBlue">
                        </div>

        function initBlastEngine(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set || set.terms.length === 0) return;

            const swap = document.getElementById('blast-swap') ? document.getElementById('blast-swap').checked : false;
            const diff = document.getElementById('blast-diff') ? parseFloat(document.getElementById('blast-diff').value) : 1;

            blastState.set = set;
            blastState.score = 0;
            blastState.activeAsteroids = [];
            blastState.running = true;
            blastState.swapRoles = swap;
            blastState.speedMult = diff;

            const canvas = document.getElementById('blast-canvas');
            blastState.canvas = canvas;
            blastState.ctx = canvas.getContext('2d');

            if (blastState.interval) clearInterval(blastState.interval);

            blastState.interval = setInterval(() => {
                if (!blastState.running) return;
                if (blastState.activeAsteroids.length < 5) {
                    const termObj = set.terms[Math.floor(Math.random() * set.terms.length)];
                    blastState.activeAsteroids.push({
                        id: termObj.id,
                        prompt: blastState.swapRoles ? termObj.definition : termObj.term,
                        target: blastState.swapRoles ? termObj.term : termObj.definition,
                        x: Math.random() * 600 + 50,
                        y: -30,
                        speed: (0.5 + Math.random() * 0.8) * blastState.speedMult
                    });
                }
            }, 3000);

            requestAnimationFrame(blastLoop);
            setTimeout(() => {
                const el = document.getElementById('blast-typing-input');
                if (el) el.focus();
            }, 100);
        }

        function blastLoop() {
            if (!blastState.running) return;
            const ctx = blastState.ctx;
            if (!ctx) return;
            ctx.clearRect(0, 0, 800, 450);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(100, 100, 2, 2);
            ctx.fillRect(400, 80, 2, 2);
            ctx.fillRect(700, 300, 2, 2);

            blastState.activeAsteroids.forEach(ast => {
                ast.y += ast.speed;
                ctx.fillStyle = '#282e3f';
                ctx.beginPath();
                ctx.arc(ast.x, ast.y, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#3ccfcf';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(ast.prompt.substring(0, 15), ast.x, ast.y + 4);

                if (ast.y > 430) {
                    blastState.running = false;
                    showModal('Game Over', `Asteroid hit surface! Final Score: ${blastState.score}`, () => window.router.navigate('study', { setId: blastState.set.id }));
                }
            });

            requestAnimationFrame(blastLoop);
        }

        function handleBlastInput(e) {

                const matchedIdx = blastState.activeAsteroids.findIndex(a => a.target.toLowerCase() === val);
                if (matchedIdx >= 0) {
                    blastState.activeAsteroids.splice(matchedIdx, 1);
                    blastState.score += 100;
                    document.getElementById('blast-score').innerText = `Score: ${blastState.score}`;
                    playSound('success');
                    e.target.value = '';

        function renderBlocks(setId) {
            return `

                        <button onclick="window.router.navigate('study', {setId: '${setId}'})" class="text-xs font-bold text-qBlue uppercase tracking-wider hover:underline">&larr; Back</button>

                            </label>

                        </div>

        function hoverBlockAt(r, c) {}

        function canPlaceShape(shape, startR, startC) {
            const rows = shape.length;
            const cols = shape[0].length;
            if (startR + rows > 8 || startC + cols > 8) return false;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] === 1 && blocksState.grid[startR + r][startC + c] === 1) {
                        return false;
                    }
                }
            }
            return true;
        }

        function placeBlockAt(r, c) {
            if (blocksState.selectedShapeIndex === null || blocksState.modalOpen) return;
            const shape = blocksState.dock[blocksState.selectedShapeIndex];
            if (!shape) return;

            if (!canPlaceShape(shape, r, c)) {
                playSound('error');
                return;
            }

            for (let sr = 0; sr < shape.length; sr++) {
                for (let sc = 0; sc < shape[0].length; sc++) {
                    if (shape[sr][sc] === 1) {
                        blocksState.grid[r + sr][c + sc] = 1;
                        blocksState.score += 10;
                    }
                }
            }

            playSound('flip');
            blocksState.dock[blocksState.selectedShapeIndex] = null;
            blocksState.selectedShapeIndex = null;
            blocksState.placedCount++;

            clearGridLines();

            if (blocksState.placedCount % 3 === 0) {
                triggerBlocksQuizCheckpoint();
            } else {
                renderBlocksBoard();
            }
        }

        function clearGridLines() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < 8; r++) {
                if (blocksState.grid[r].every(val => val === 1)) rowsToClear.push(r);
            }

            for (let c = 0; c < 8; c++) {
                let full = true;
                for (let r = 0; r < 8; r++) {
                    if (blocksState.grid[r][c] !== 1) { full = false; break; }
                }
                if (full) colsToClear.push(c);
            }

            if (rowsToClear.length > 0 || colsToClear.length > 0) {
                playSound('success');
                rowsToClear.forEach(r => {
                    for (let c = 0; c < 8; c++) blocksState.grid[r][c] = 0;
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < 8; r++) blocksState.grid[r][c] = 0;
                });
                blocksState.score += (rowsToClear.length + colsToClear.length) * 100;
            }
        }

        function triggerBlocksQuizCheckpoint() {

            const options = [current, ...distractors].sort(() => Math.random() - 0.5);

            const isSwap = blocksState.swapRoles;

            document.getElementById('blocks-q-type-label').innerText = isSwap ? "Select the matching Term:" : "Select the matching Definition:";
            document.getElementById('blocks-q-prompt').innerText = promptText;

            const optionsContainer = document.getElementById('blocks-q-options');
            optionsContainer.innerHTML = options.map(opt => {
                const optText = isSwap ? opt.term : opt.definition;
                return `
                    <button onclick="answerBlocksCheckpoint('${opt.id}', '${current.id}')" 
                            class="w-full text-left p-3.5 rounded-xl border border-qBorderLight dark:border-qBorderDark hover:border-qBlue hover:bg-blue-50 dark:hover:bg-slate-800 text-xs sm:text-sm font-semibold transition">
                        ${escapeHtml(optText)}

        function checkBlocksGameOver() {
            if (blocksState.modalOpen) return;

            const availableShapes = blocksState.dock.filter(s => s !== null);
            if (availableShapes.length === 0) return;

            let canPlaceAny = false;
            for (let shape of availableShapes) {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (canPlaceShape(shape, r, c)) {
                            canPlaceAny = true;
                            break;
                        }
                    }
                    if (canPlaceAny) break;
                }
                if (canPlaceAny) break;
            }

            if (!canPlaceAny) {
                showModal('Game Over', `No more valid moves remaining! Final Score: ${blocksState.score}`, () => {
                    initBlocksEngine(blocksState.set.id);

        let memoryState = { set: null, cards: [], selected: [], matched: [] };

        function renderMemory(setId) {

        function flipMemoryCard(idx) {
            if (memoryState.selected.length >= 2 || memoryState.selected.includes(idx)) return;
            memoryState.selected.push(idx);
            renderMemoryBoard();

            if (memoryState.selected.length === 2) {
                const c1 = memoryState.cards[memoryState.selected[0]];
                const c2 = memoryState.cards[memoryState.selected[1]];
                if (c1.id === c2.id && c1.uid !== c2.uid) {
                    memoryState.matched.push(c1.uid, c2.uid);
                    memoryState.selected = [];
                    playSound('success');

        function handleGlobalSearch(query) {
            if (window.router.currentView === 'library') {
                filterLibrarySets(query);
            }
        }

        // ==================================================================
        // Sharing: publish sets to GitHub Gists (links that stay the same)
        // ==================================================================
        const GH_KEY = 'quizit_github_v1';
        const GH_API = 'https://api.github.com';
        const GIST_FILE = 'quizit-set.json';
        const REGISTRY_FILE = 'quizit-index.json';
        let shareNote = '';

        // ---- Safety: anything that arrives from a link/code/file is cleaned first ----
        function safeId(v, fallback) {
            return String(v == null ? '' : v).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 60) || fallback;
        }
        function cleanStr(v, max) { return (typeof v === 'string' ? v : '').slice(0, max); }
        function cleanImage(v) {
            if (typeof v !== 'string') return '';
            if (/^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(v)) return v;
            if (v.length < 2000 && /^https:\/\/[^\s"'<>`\\]+$/.test(v)) return v;
            return '';
        }
        function sanitizeSet(raw, localId, keepFolder) {
            if (!raw || typeof raw.title !== 'string' || !Array.isArray(raw.terms)) {
                throw new Error('This does not look like a QuizIt set.');
            }
            const seen = new Set();
            const terms = raw.terms.slice(0, 2000).map((t, i) => {
                t = t || {};
                let id = safeId(t.id, 't' + i);
                while (seen.has(id)) id += 'x';
                seen.add(id);
                return {
                    id,
                    term: cleanStr(t.term, 2000),
                    definition: cleanStr(t.definition, 4000),
                    image: cleanImage(t.image),
                    imageSide: t.imageSide === 'front' ? 'front' : 'back',
                    starred: t.starred === true
                };
            });
            const out = {
                id: localId,
                title: cleanStr(raw.title, 200) || 'Untitled',
                description: cleanStr(raw.description, 1000),
                author: cleanStr(raw.author, 60).trim(),
                folderId: keepFolder ? safeId(raw.folderId, '') : '',
                createdAt: Number(raw.createdAt) || Date.now(),
                terms
            };
            // Only a backup restore keeps the link to a published gist
            if (keepFolder && raw.gist && typeof raw.gist === 'object' && /^[0-9a-f]{20,40}$/.test(String(raw.gist.id))) {
                out.gist = {
                    id: String(raw.gist.id),
                    owner: safeId(raw.gist.owner, ''),
                    alias: validAlias(String(raw.gist.alias || '')) ? String(raw.gist.alias) : ''
                };
            }
            return out;
        }
        function sanitizeFolder(f) {
            return {
                id: safeId(f && f.id, 'folder_' + Math.random().toString(36).slice(2, 8)),
                title: cleanStr(f && f.title, 100) || 'Folder'
            };
        }

        // ---- GitHub plumbing ----
        function ghGetAuth() {
            try { return JSON.parse(localStorage.getItem(GH_KEY)) || null; } catch (e) { return null; }
        }
        function ghSetAuth(a) {
            if (a) localStorage.setItem(GH_KEY, JSON.stringify(a)); else localStorage.removeItem(GH_KEY);
        }

        async function ghFetch(path, opts = {}) {
            const url = path.startsWith('http') ? path : GH_API + path;
            const method = (opts.method || 'GET').toUpperCase();
            const auth = ghGetAuth();
            const build = (withAuth) => {
                const headers = { 'Accept': 'application/vnd.github+json' };
                if (withAuth && auth && auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
                if (opts.body) headers['Content-Type'] = 'application/json';
                return { method, headers, body: opts.body, cache: 'no-store' };
            };
            let res;
            try {
                res = await fetch(url, build(true));
                // A stale/revoked token must not stop people from reading public links
                if (res.status === 401 && method === 'GET' && auth) res = await fetch(url, build(false));
            } catch (e) {
                throw new Error('Could not reach GitHub. Check your internet connection.');
            }
            if (!res.ok) {
                const messages = {
                    401: 'GitHub did not accept your saved token. Reconnect it in the Account tab.',
                    403: 'GitHub refused the request. You may be rate-limited (wait a few minutes) or the token is missing the "gist" permission.',
                    404: 'Not found on GitHub. The link may be wrong, or the set was deleted.',
                    422: 'GitHub rejected the data (is the set too large?).',
                    429: 'GitHub is rate-limiting requests. Try again in a few minutes.'
                };
                const err = new Error(messages[res.status] || ('GitHub error ' + res.status));
                err.status = res.status;
                throw err;
            }
            return res.json();
        }

        async function ghReadGistFile(id, filename, ownerHint) {
            let g;
            try {
                g = await ghFetch('/gists/' + encodeURIComponent(id));
            } catch (e) {
                // Rate-limited? Raw gist URLs are not counted against the API limit.
                if ((e.status === 403 || e.status === 429) && ownerHint && /^[A-Za-z0-9-]{1,39}$/.test(ownerHint)) {
                    let r = null;
                    try {
                        r = await fetch('https://gist.githubusercontent.com/' + ownerHint + '/' + encodeURIComponent(id) + '/raw/' + filename + '?cb=' + Date.now(), { cache: 'no-store' });
                    } catch (e2) { r = null; }
                    if (r && r.ok) return { text: await r.text(), owner: ownerHint };
                }
                throw e;
            }
            const f = g.files && g.files[filename];
            if (!f) throw new Error('This link does not point to a QuizIt set.');
            let text = f.content;
            if (f.truncated || typeof text !== 'string') {
                let r;
                try { r = await fetch(f.raw_url); } catch (e) { throw new Error('Could not download the set.'); }
                if (!r.ok) throw new Error('Could not download the set.');
                text = await r.text();
            }
            return { text, owner: g.owner && g.owner.login };
        }

        // ---- Short codes: a small public "index" gist maps code -> set gist ----
        function normAlias(s) { return String(s || '').trim().toLowerCase().replace(/[^a-z0-9-]/g, ''); }
        function validAlias(a) { return /^[a-z0-9][a-z0-9-]{1,23}$/.test(a) && !/^[0-9a-f]{20,}$/.test(a); }
        function own(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }

        async function ghFindRegistry(owner) {
            const cacheKey = 'quizit_reg_' + owner.toLowerCase();
            const cached = localStorage.getItem(cacheKey);
            if (cached) return cached;
            for (let page = 1; page <= 3; page++) {
                const list = await ghFetch('/users/' + encodeURIComponent(owner) + '/gists?per_page=100&page=' + page);
                const hit = list.find(g => g.files && g.files[REGISTRY_FILE]);
                if (hit) { localStorage.setItem(cacheKey, hit.id); return hit.id; }
                if (list.length < 100) break;
            }
            return null;
        }

        async function ghResolveAlias(owner, code) {
            for (let attempt = 0; attempt < 2; attempt++) {
                const regId = await ghFindRegistry(owner);
                if (!regId) throw new Error('No short codes were found for "' + owner + '".');
                try {
                    const { text } = await ghReadGistFile(regId, REGISTRY_FILE);
                    const reg = JSON.parse(text);
                    const id = own(reg.aliases, code) ? reg.aliases[code] : null;
                    if (!id || !/^[0-9a-f]{20,40}$/i.test(id)) throw new Error('The short code "' + code + '" was not found.');
                    return String(id).toLowerCase();
                } catch (e) {
                    if (e.status === 404 && attempt === 0) { localStorage.removeItem('quizit_reg_' + owner.toLowerCase()); continue; }
                    throw e;
                }
            }
        }

        async function ghUpdateRegistry(gistId, newAlias) {
            const auth = ghGetAuth();
            const cacheKey = 'quizit_reg_' + auth.login.toLowerCase();
            for (let attempt = 0; attempt < 2; attempt++) {
                let regId = await ghFindRegistry(auth.login);
                if (!regId) {
                    const g = await ghFetch('/gists', {
                        method: 'POST',
                        body: JSON.stringify({
                            description: 'QuizIt short codes (please do not delete)',
                            public: true,
                            files: { [REGISTRY_FILE]: { content: JSON.stringify({ aliases: {} }) } }
                        })
                    });
                    regId = g.id;
                    localStorage.setItem(cacheKey, regId);
                }
                try {
                    const { text } = await ghReadGistFile(regId, REGISTRY_FILE);
                    let reg; try { reg = JSON.parse(text); } catch (e) { reg = {}; }
                    const aliases = (reg && typeof reg.aliases === 'object' && reg.aliases) ? reg.aliases : {};
                    if (newAlias && own(aliases, newAlias) && aliases[newAlias] !== gistId) {
                        throw new Error('The short code "' + newAlias + '" is already used by another set. Pick a different one.');
                    }
                    Object.keys(aliases).forEach(k => { if (aliases[k] === gistId) delete aliases[k]; });
                    if (newAlias) aliases[newAlias] = gistId;
                    await ghFetch('/gists/' + regId, {
                        method: 'PATCH',
                        body: JSON.stringify({ files: { [REGISTRY_FILE]: { content: JSON.stringify({ aliases }, null, 1) } } })
                    });
                    return;
                } catch (e) {
                    if (e.status === 404 && attempt === 0) { localStorage.removeItem(cacheKey); continue; }
                    throw e;
                }
            }
        }

        // ---- Publishing ----
        function saveSetGistPointer(setId, gist) {
            const db = getDB();
            const s = db.sets.find(x => x.id === setId);
            if (s) { s.gist = gist; saveDB(db); }
        }

        async function publishSetToGist(setId, aliasInput) {
            const auth = ghGetAuth();
            if (!auth || !auth.token) throw new Error('Connect your GitHub account first.');
            const set = getDB().sets.find(s => s.id === setId);
            if (!set) throw new Error('Set not found.');
            const alias = normAlias(aliasInput);
            if (alias && !validAlias(alias)) throw new Error('Short codes need 2–24 letters, numbers or dashes.');

            const payload = {
                quizit: 1,
                publishedAt: new Date().toISOString(),
                set: {
                    title: set.title,
                    description: set.description || '',
                    author: (getSettings().displayName || '').trim().slice(0, 60),
                    terms: set.terms.map(t => ({
                        id: t.id, term: t.term, definition: t.definition,
                        image: t.image || '', imageSide: t.imageSide || 'back'
                    }))
                }
            };
            const content = JSON.stringify(payload);
            if (content.length > 8000000) throw new Error('This set is too large to publish (uploaded images?). Use image URLs instead of uploads.');

            let gistId = set.gist && set.gist.id;
            if (gistId) {
                try {
                    await ghFetch('/gists/' + gistId, {
                        method: 'PATCH',
                        body: JSON.stringify({ description: 'QuizIt: ' + set.title, files: { [GIST_FILE]: { content } } })
                    });
                } catch (e) {
                    if (e.status === 404) throw new Error('The published copy no longer exists on GitHub (deleted, or it belongs to another account).');
                    throw e;
                }
            } else {
                const g = await ghFetch('/gists', {
                    method: 'POST',
                    body: JSON.stringify({ description: 'QuizIt: ' + set.title, public: false, files: { [GIST_FILE]: { content } } })
                });
                gistId = g.id;
            }
            const oldAlias = (set.gist && set.gist.alias) || '';
            let pointer = { id: gistId, owner: auth.login, alias: oldAlias };
            saveSetGistPointer(setId, pointer);   // saved first, so a failed short code never loses the link
            if (alias !== oldAlias) {
                await ghUpdateRegistry(gistId, alias);
                pointer = { id: gistId, owner: auth.login, alias };
                saveSetGistPointer(setId, pointer);
            }
            return pointer;
        }

        // ---- Opening links ----
        function hostOwner() {
            const h = location.hostname.toLowerCase();
            if (h.endsWith('.github.io')) return h.split('.')[0];
            const a = ghGetAuth();
            return a ? a.login : null;
        }

        // Accepts: full link, "#code", "code", "user/code", or a 32-character gist id
        function parseLinkToken(input) {
            let s = String(input || '').trim();
            let owner = null;
            if (/^https?:\/\//i.test(s)) {
                try {
                    const u = new URL(s);
                    const h = u.hostname.toLowerCase();
                    if (h.endsWith('.github.io')) owner = h.split('.')[0];
                    s = u.hash;
                } catch (e) { return null; }
            }
            const i = s.indexOf('#');
            if (i >= 0) s = s.slice(i + 1);
            try { s = decodeURIComponent(s); } catch (e) { return null; }
            s = s.replace(/^\/+/, '').trim();
            let code = s;
            if (s.includes('/')) {
                const parts = s.split('/');
                if (parts.length !== 2) return null;
                owner = parts[0]; code = parts[1];
            }
            code = code.trim().toLowerCase();
            if (owner && !/^[A-Za-z0-9-]{1,39}$/.test(owner)) return null;
            if (/^[0-9a-f]{20,40}$/.test(code)) return { owner, gistId: code };
            if (validAlias(code)) {
                owner = owner || hostOwner();
                if (!owner) return null;
                return { owner, alias: code };
            }
            return null;
        }

        async function importGistSet(gistId, hint = {}) {
            const { text, owner } = await ghReadGistFile(gistId, GIST_FILE, hint.owner);
            let parsed;
            try { parsed = JSON.parse(text); } catch (e) { throw new Error('This link does not point to a QuizIt set.'); }
            const raw = parsed && parsed.set ? parsed.set : parsed;
            const db = getDB();
            // The owner opening their own link just goes to their own (editable) copy
            const mine = db.sets.find(s => s.gist && s.gist.id === gistId && !String(s.id).startsWith('gist_'));
            if (mine) return { id: mine.id, changed: false };

            const localId = 'gist_' + gistId;
            const clean = sanitizeSet(raw, localId, false);
            clean.terms.forEach(t => { t.starred = false; });
            const sig = s => JSON.stringify([s.title, s.description, s.author || '', (s.terms || []).map(t => [t.term, t.definition, t.image, t.imageSide])]);
            const idx = db.sets.findIndex(s => s.id === localId);
            let changed = true;
            let old = null;
            if (idx >= 0) {
                old = db.sets[idx];
                const starred = new Set((old.terms || []).filter(t => t.starred).map(t => t.id));
                clean.terms.forEach(t => { t.starred = starred.has(t.id); });
                clean.folderId = old.folderId || '';
                clean.createdAt = old.createdAt || clean.createdAt;
                changed = sig(old) !== sig(clean);
            }
            clean.gist = {
                id: gistId,
                owner: owner || hint.owner || '',
                alias: hint.alias || (old && old.gist && old.gist.alias) || '',
                syncedAt: Date.now()
            };
            if (idx >= 0) db.sets[idx] = clean; else db.sets.push(clean);
            saveDB(db);
            return { id: localId, changed };
        }

        async function openLinkedSet(p) {
            showModal('Opening set…', 'Fetching the latest version from GitHub.');
            try {
                const gistId = p.gistId || await ghResolveAlias(p.owner, p.alias);
                const res = await importGistSet(gistId, { owner: p.owner, alias: p.alias });
                closeModal();
                window.router.navigate('study', { setId: res.id });
                return gistId;
            } catch (e) {
                showModal('Could not open the set', e.message || 'Something went wrong.');
            }
        }

        async function refreshLinkedSet(setId) {
            const set = getDB().sets.find(s => s.id === setId);
            if (!set || !set.gist) return;
            try {
                const res = await importGistSet(set.gist.id, { owner: set.gist.owner, alias: set.gist.alias });
                window.router.navigate('study', { setId: res.id });
                showModal(res.changed ? 'Updated' : 'Up to date', res.changed ? 'You now have the latest version of this set.' : 'You already have the latest version.');
            } catch (e) {
                showModal('Could not update', e.message || 'Something went wrong.');
            }
        }

        // Pull updates for every set you opened from a link: on each page load,
        // and when you come back to the tab (at most once a minute).
        let syncing = false, lastSyncAt = 0;
        async function syncLinkedSets(excludeId) {
            if (syncing) return;
            syncing = true;
            lastSyncAt = Date.now();
            try {
                const linked = getDB().sets
                    .filter(s => String(s.id).startsWith('gist_') && s.gist && s.gist.id && s.gist.id !== excludeId)
                    .slice(0, 10);
                if (!linked.length) return;
                let updated = 0, failed = 0;
                for (const s of linked) {
                    try {
                        const r = await importGistSet(s.gist.id, { owner: s.gist.owner, alias: s.gist.alias });
                        if (r.changed) updated++;
                    } catch (e) {
                        if (e.status !== 404) failed++;   // 404 = the owner removed it; keep your copy quietly
                    }
                }
                const v = window.router.currentView;
                if (updated && (v === 'dashboard' || v === 'library' || v === 'study')) window.router.navigate(v, window.router.params);
                if (updated) showToast('Updated ' + updated + ' shared set' + (updated > 1 ? 's' : '') + ' ✓');
                else if (failed) showToast("Couldn't check your shared sets for updates right now.", true);
            } finally {
                syncing = false;
            }
        }

        function handleLinkHash() {
            const p = parseLinkToken(location.hash);
            if (p) openLinkedSet(p).then(id => syncLinkedSets(id));
            else syncLinkedSets();
        }

        // ---- Share / publish screens ----
        function buildShareLink(code, owner) {
            const base = location.href.split('#')[0];
            const isId = /^[0-9a-f]{20,40}$/.test(code);
            const host = location.hostname.toLowerCase();
            const hostOwned = host.endsWith('.github.io') && owner && host.split('.')[0] === owner.toLowerCase();
            const prefix = (isId || hostOwned || !owner) ? '' : owner + '/';
            return base + '#' + prefix + code;
        }

        function copyField(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.focus(); el.select();
            const done = () => {
                const b = document.getElementById(id + '-btn');
                if (b) { b.textContent = 'Copied ✓'; setTimeout(() => { b.textContent = 'Copy'; }, 1500); }
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(el.value).then(done, () => { try { document.execCommand('copy'); } catch (e) {} done(); });
            } else {
                try { document.execCommand('copy'); } catch (e) {}
                done();
            }
        }

        function linkBoxHtml(link, label) {
            return `
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">${label}</label>
                    <div class="flex gap-2">
                        <input id="share-link" readonly value="${escapeHtml(link)}" onclick="this.select()" class="flex-1 min-w-0 bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl text-xs font-mono outline-none select-text">
                        <button id="share-link-btn" onclick="copyField('share-link')" class="px-3 bg-qBlue text-white font-bold rounded-xl text-xs">Copy</button>
                    </div>
                </div>`;
        }

        function connectHtml(setId) {
            return `
                <div class="space-y-3">
                    <ol class="list-decimal pl-5 space-y-1.5 text-xs text-slate-500 dark:text-slate-400">
                        <li>Click <a href="https://github.com/settings/tokens/new?scopes=gist&description=QuizIt" target="_blank" rel="noopener" class="text-qBlue font-bold underline">Create token on GitHub</a> and sign in if asked.</li>
                        <li>Leave <b>gist</b> ticked, choose how long it lasts, scroll down and press <b>Generate token</b>.</li>
                        <li>Copy the token (it starts with <code>ghp_</code>) and paste it below.</li>
                    </ol>
                    <input id="gh-token" type="password" autocomplete="off" placeholder="Paste token here" class="w-full bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl text-xs font-mono outline-none select-text">
                    <button onclick="doConnect('${setId}')" class="w-full bg-qBlue text-white font-bold py-2.5 rounded-xl text-sm">Connect</button>
                    <p id="gh-status" class="text-xs text-slate-500"></p>
                    <p class="text-[11px] text-slate-400">The token is stored only in this browser and can only work with your gists. You can revoke it any time at github.com/settings/tokens.</p>
                </div>`;
