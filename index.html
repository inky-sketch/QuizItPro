<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizIt Pro - Study Smarter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        qBlue: '#4255ff',
                        qCyan: '#3ccfcf',
                        qDark: '#0a092d',
                        qLightBg: '#f6f7fb',
                        qDarkBg: '#13122b',
                        qCardLight: '#ffffff',
                        qCardDark: '#1e1c3a',
                        qBorderLight: '#d9dde8',
                        qBorderDark: '#2e2b58',
                        qGreen: '#23b26d',
                        qRed: '#ff7777'
                    }
                }
            }
        }
    </script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-qLightBg dark:bg-qDarkBg text-slate-800 dark:text-slate-100 min-h-screen flex font-sans select-none transition-colors duration-200">

    <aside id="sidebar" class="w-64 bg-white dark:bg-[#181632] border-r border-qBorderLight dark:border-qBorderDark flex flex-col fixed inset-y-0 left-0 z-40 transition-transform -translate-x-full md:translate-x-0">
        <div class="p-6 flex items-center justify-between border-b border-qBorderLight dark:border-qBorderDark">
            <h1 onclick="window.router.navigate('dashboard')" class="text-2xl font-black text-qBlue tracking-wider cursor-pointer flex items-center gap-2">
                QuizIt <span class="text-[10px] bg-qBlue text-white px-1.5 py-0.5 rounded font-mono">PRO</span>
            </h1>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-qBlue">✕</button>
        </div>

        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <button onclick="window.router.navigate('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition nav-btn" data-view="dashboard">
                🏠 Home
            </button>
            <button onclick="window.router.navigate('library')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition nav-btn" data-view="library">
                📚 Library & Sets
            </button>
            <button onclick="window.router.navigate('folders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition nav-btn" data-view="folders">
                📁 Folders
            </button>
            <button onclick="window.router.navigate('creator')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition nav-btn text-qBlue" data-view="creator">
                ➕ Create New Set
            </button>
        </nav>

        <div class="p-4 border-t border-qBorderLight dark:border-qBorderDark space-y-2">
            <div class="flex items-center justify-between px-3 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl text-xs font-semibold">
                <span>Dark Mode</span>
                <button onclick="toggleDarkMode()" id="dark-mode-btn" class="px-3 py-1 bg-qBlue text-white rounded-lg transition shadow-sm">Toggle</button>
            </div>
            <div class="flex gap-2">
                <button onclick="openAdvancedImportModal()" class="flex-1 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold py-2 rounded-xl transition text-center">Import</button>
                <button onclick="openShareCodeModal()" class="flex-1 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold py-2 rounded-xl transition text-center">Share Code</button>
            </div>
            <button onclick="exportAllData()" class="w-full text-xs bg-red-50 dark:bg-red-950/30 text-red-500 font-semibold py-2 rounded-xl transition text-center">Backup All Data</button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col md:ml-64 min-h-screen">
        <header class="bg-white/80 dark:bg-[#181632]/80 backdrop-blur-md border-b border-qBorderLight dark:border-qBorderDark h-16 px-6 flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-xl p-2">☰</button>
                <div class="relative w-48 sm:w-80">
                    <input type="text" id="global-search" oninput="handleGlobalSearch(this.value)" placeholder="Search sets, terms..." class="w-full bg-slate-100 dark:bg-slate-800 border border-qBorderLight dark:border-qBorderDark rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-qBlue outline-none transition">
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.router.navigate('creator')" class="bg-qBlue hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm">+ Create</button>
            </div>
        </header>

        <main id="app" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto">
            <!-- Dynamic Content -->
        </main>
    </div>

    <div id="custom-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <h3 id="modal-title" class="text-xl font-black">Notice</h3>
            <p id="modal-msg" class="text-sm text-slate-500 dark:text-slate-400"></p>
            <div id="modal-custom-content"></div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="modal-cancel-btn" onclick="closeModal()" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 font-semibold rounded-xl text-sm hover:bg-slate-200">Cancel</button>
                <button id="modal-ok-btn" onclick="closeModal()" class="px-4 py-2 bg-qBlue text-white font-bold rounded-xl text-sm hover:bg-blue-700">OK</button>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }

        const DB_KEY = 'quizit_master_db_v2';
        const SETTINGS_KEY = 'quizit_settings_v2';

        function getDB() {
            let data = localStorage.getItem(DB_KEY);
            if (!data) {
                const initial = {
                    sets: [
                        {
                            id: 'set_sample_1',
                            title: 'Web Development Basics',
                            description: 'Core concepts of HTML, CSS, and JavaScript for beginners.',
                            folderId: 'folder_dev',
                            createdAt: Date.now(),
                            terms: [
                                { id: 't1', term: 'HTML', definition: 'HyperText Markup Language; structures web pages.', image: '', starred: true },
                                { id: 't2', term: 'CSS', definition: 'Cascading Style Sheets; styles the visual presentation.', image: '', starred: false },
                                { id: 't3', term: 'JavaScript', definition: 'Programming language for adding interactive behavior.', image: '', starred: true }
                            ]
                        }
                    ],
                    folders: [
                        { id: 'folder_dev', title: 'Programming & Tech' }
                    ]
                };
                localStorage.setItem(DB_KEY, JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(data);
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function getSettings() {
            let s = localStorage.getItem(SETTINGS_KEY);
            if (!s) {
                const def = { darkMode: false };
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(def));
                return def;
            }
            return JSON.parse(s);
        }

        function saveSettings(settings) {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        }

        function showModal(title, msg, onOk = null, customHtml = '') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal-custom-content').innerHTML = customHtml;
            const okBtn = document.getElementById('modal-ok-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            
            if (onOk) {
                cancelBtn.classList.remove('hidden');
                okBtn.onclick = () => { closeModal(); onOk(); };
            } else {
                cancelBtn.classList.add('hidden');
                okBtn.onclick = closeModal;
            }
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            document.getElementById('custom-modal').classList.remove('flex');
        }

        function toggleDarkMode() {
            const settings = getSettings();
            settings.darkMode = !settings.darkMode;
            saveSettings(settings);
            applyTheme(settings.darkMode);
        }

        function applyTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        const router = {
            currentView: 'dashboard',
            params: {},
            navigate(view, params = {}) {
                this.currentView = view;
                this.params = params;
                window.scrollTo(0,0);
                
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.getAttribute('data-view') === view) {
                        btn.classList.add('bg-blue-50', 'dark:bg-slate-800', 'text-qBlue');
                    } else {
                        btn.classList.remove('bg-blue-50', 'dark:bg-slate-800', 'text-qBlue');
                    }
                });

                const app = document.getElementById('app');
                switch(view) {
                    case 'dashboard': app.innerHTML = renderDashboard(); break;
                    case 'library': app.innerHTML = renderLibrary(); break;
                    case 'folders': app.innerHTML = renderFolders(); break;
                    case 'creator': app.innerHTML = renderCreator(params.setId); initCreatorForm(params.setId); break;
                    case 'study': app.innerHTML = renderStudyHub(params.setId); break;
                    case 'flashcards': app.innerHTML = renderFlashcards(params.setId); initFlashcardsEngine(params.setId); break;
                    case 'learn': app.innerHTML = renderLearn(params.setId); initLearnEngine(params.setId); break;
                    case 'test': app.innerHTML = renderTest(params.setId); initTestEngine(params.setId); break;
                    case 'match': app.innerHTML = renderMatch(params.setId); initMatchEngine(params.setId); break;
                    case 'blast': app.innerHTML = renderBlast(params.setId); initBlastEngine(params.setId); break;
                    case 'blocks': app.innerHTML = renderBlocks(params.setId); initBlocksEngine(params.setId); break;
                    case 'memory': app.innerHTML = renderMemory(params.setId); initMemoryEngine(params.setId); break;
                    default: app.innerHTML = renderDashboard();
                }
            }
        };
        window.router = router;

        function renderDashboard() {
            const db = getDB();
            const recentSets = [...db.sets].sort((a,b) => b.createdAt - a.createdAt).slice(0, 6);
            return `
                <div class="space-y-8 pb-16">
                    <div class="bg-gradient-to-r from-qBlue to-indigo-600 rounded-3xl p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
                        <div class="space-y-2">
                            <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">Welcome</span>
                            <h1 class="text-3xl font-black">Ready to study?</h1>
                            <p class="text-white/80 text-sm">Select a study set or create a new one instantly.</p>
                        </div>
                        <button onclick="window.router.navigate('creator')" class="bg-white text-qBlue font-extrabold px-6 py-3 rounded-2xl shadow-lg hover:bg-slate-100 transition shrink-0">+ Create Study Set</button>
                    </div>

                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-black">Recent Study Sets</h2>
                            <button onclick="window.router.navigate('library')" class="text-xs font-bold text-qBlue hover:underline">View All &rarr;</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${recentSets.length === 0 ? `<p class="text-sm text-slate-400">No study sets found.</p>` : recentSets.map(set => `
                                <div onclick="window.router.navigate('study', {setId: '${set.id}'})" class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-2xl p-6 hover:shadow-lg transition cursor-pointer flex flex-col justify-between group">
                                    <div>
                                        <div class="flex justify-between items-start mb-3">
                                            <span class="text-xs font-bold uppercase tracking-wider bg-blue-50 dark:bg-blue-950/40 text-qBlue px-2.5 py-1 rounded-md">${set.terms.length} terms</span>
                                            <span class="text-xs text-slate-400">📁 ${getFolderName(set.folderId)}</span>
                                        </div>
                                        <h3 class="text-lg font-bold group-hover:text-qBlue transition mb-1 line-clamp-1">${escapeHtml(set.title)}</h3>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4">${escapeHtml(set.description || 'No description.')}</p>
                                    </div>
                                    <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800 text-xs font-semibold text-qBlue">
                                        <span>Study Now</span>
                                        <span>&rarr;</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function getFolderName(id) {
            const db = getDB();
            const f = db.folders.find(x => x.id === id);
            return f ? f.title : 'Unsorted';
        }

        function renderLibrary() {
            const db = getDB();
            return `
                <div class="space-y-6 pb-16">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-[#181632] p-6 rounded-3xl border border-qBorderLight dark:border-qBorderDark shadow-sm">
                        <div>
                            <h1 class="text-2xl font-black">Your Library</h1>
                            <p class="text-sm text-slate-500">All your flashcard sets in one place.</p>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto">
                            <input type="text" oninput="filterLibrarySets(this.value)" placeholder="Filter sets..." class="bg-slate-50 dark:bg-slate-800 border border-qBorderLight dark:border-qBorderDark px-4 py-2 rounded-xl text-sm outline-none w-full sm:w-64">
                        </div>
                    </div>

                    <div id="library-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${db.sets.map(set => libraryCardHtml(set)).join('')}
                    </div>
                </div>
            `;
        }

        function libraryCardHtml(set) {
            return `
                <div class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-2xl p-6 hover:shadow-lg transition flex flex-col justify-between group">
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold uppercase tracking-wider bg-blue-50 dark:bg-blue-950/40 text-qBlue px-2.5 py-1 rounded-md">${set.terms.length} terms</span>
                            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                                <button onclick="window.router.navigate('creator', {setId: '${set.id}'})" class="p-1 hover:text-qBlue">✏️</button>
                                <button onclick="shareSetCode('${set.id}')" class="p-1 hover:text-qBlue" title="Share Code">🔗</button>
                                <button onclick="deleteSet('${set.id}')" class="p-1 hover:text-red-500">🗑️</button>
                            </div>
                        </div>
                        <h3 onclick="window.router.navigate('study', {setId: '${set.id}'})" class="text-lg font-bold group-hover:text-qBlue cursor-pointer transition mb-1 line-clamp-1">${escapeHtml(set.title)}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4">${escapeHtml(set.description || 'No description.')}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="window.router.navigate('study', {setId: '${set.id}'})" class="flex-1 bg-slate-100 dark:bg-slate-800 hover:bg-qBlue hover:text-white font-semibold py-2 rounded-xl text-xs transition text-center">Study</button>
                        <button onclick="exportSetJson('${set.id}')" class="px-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 font-semibold py-2 rounded-xl text-xs transition">💾</button>
                    </div>
                </div>
            `;
        }

        function filterLibrarySets(query) {
            const db = getDB();
            const filtered = db.sets.filter(s => s.title.toLowerCase().includes(query.toLowerCase()) || (s.description && s.description.toLowerCase().includes(query.toLowerCase())));
            const grid = document.getElementById('library-grid');
            grid.innerHTML = filtered.length === 0 ? `<p class="text-sm text-slate-400 col-span-full">No matching sets.</p>` : filtered.map(s => libraryCardHtml(s)).join('');
        }

        function deleteSet(id) {
            showModal('Confirm Deletion', 'Delete this study set? This action is permanent.', () => {
                const db = getDB();
                db.sets = db.sets.filter(s => s.id !== id);
                saveDB(db);
                window.router.navigate('library');
            });
        }

        function renderFolders() {
            const db = getDB();
            return `
                <div class="space-y-6 pb-16">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-[#181632] p-6 rounded-3xl border border-qBorderLight dark:border-qBorderDark shadow-sm">
                        <div>
                            <h1 class="text-2xl font-black">Folders</h1>
                            <p class="text-sm text-slate-500">Organize your study sets into groups.</p>
                        </div>
                        <button onclick="createNewFolderPrompt()" class="bg-qBlue hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm">+ New Folder</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${db.folders.length === 0 ? `<p class="text-sm text-slate-400">No folders created yet.</p>` : db.folders.map(f => {
                            const setNum = db.sets.filter(s => s.folderId === f.id).length;
                            return `
                                <div class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-2xl p-6 flex items-center justify-between shadow-sm hover:shadow-md transition">
                                    <div>
                                        <h3 class="font-bold text-base mb-1">📁 ${escapeHtml(f.title)}</h3>
                                        <span class="text-xs text-slate-400">${setNum} sets inside</span>
                                    </div>
                                    <button onclick="deleteFolder('${f.id}')" class="text-slate-400 hover:text-red-500 p-2">🗑️</button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function createNewFolderPrompt() {
            const html = `<input type="text" id="new-folder-title-input" placeholder="Folder Title" class="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs outline-none">`;
            showModal('Create Folder', 'Enter title for the folder.', () => {
                const title = document.getElementById('new-folder-title-input').value.trim();
                if (title) {
                    const db = getDB();
                    db.folders.push({ id: 'folder_' + Date.now(), title });
                    saveDB(db);
                    window.router.navigate('folders');
                }
            }, html);
        }

        function deleteFolder(id) {
            showModal('Delete Folder', 'Remove folder? Sets inside will be moved to Unsorted.', () => {
                const db = getDB();
                db.folders = db.folders.filter(f => f.id !== id);
                db.sets.forEach(s => { if (s.folderId === id) s.folderId = ''; });
                saveDB(db);
                window.router.navigate('folders');
            });
        }

        let currentEditingSetId = null;
        let editorTerms = [];

        function renderCreator(setId = null) {
            currentEditingSetId = setId;
            return `
                <div class="max-w-4xl mx-auto space-y-6 pb-16">
                    <div class="flex justify-between items-center bg-white dark:bg-[#181632] p-6 rounded-3xl border border-qBorderLight dark:border-qBorderDark shadow-sm">
                        <h1 class="text-2xl font-black">${setId ? 'Edit Study Set' : 'Create New Study Set'}</h1>
                        <button onclick="saveStudySet()" class="bg-qBlue hover:bg-blue-700 text-white font-extrabold px-6 py-2.5 rounded-xl text-sm transition shadow-md">Save Set</button>
                    </div>

                    <div class="bg-white dark:bg-[#181632] border border-qBorderLight dark:border-qBorderDark rounded-3xl p-6 space-y-4 shadow-sm">
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Title</label>
                            <input type="text" id="set-title" placeholder="e.g. Biology - Chapter 1 Cell Structure" class="w-full bg-slate-50 dark:bg-slate-800 border border-qBorderLight dark:border-qBorderDark rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-qBlue">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Description</label>
                                <input type="text" id="set-desc" placeholder="Add a description..." class="w-full bg-slate-50 dark:bg-slate-800 border border-qBorderLight dark:border-qBorderDark rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-qBlue">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Folder</label>
                                <select id="set-folder" class="w-full bg-slate-50 dark:bg-slate-800 border border-qBorderLight dark:border-qBorderDark rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-qBlue">
                                    <option value="">(No Folder)</option>

        function handleSuggestions(el, type, id) {
            const query = el.value.trim().toLowerCase();
            const box = document.getElementById(`sug-${type}-${id}`);
            if (!box) return;
            if (query.length < 2) {
                box.classList.add('hidden');
                return;
            }
            const db = getDB();
            let matches = [];
            db.sets.forEach(s => {
                s.terms.forEach(t => {
                    const val = type === 'term' ? t.term : t.definition;
                    if (val.toLowerCase().includes(query) && !matches.includes(val)) {
                        matches.push(val);
                    }
                });
            });
            matches = matches.slice(0, 3);
            if (matches.length === 0) {
                box.classList.add('hidden');
                return;
            }
            box.innerHTML = matches.map(m => `
                <div onclick="applySuggestion('${id}', '${type}', \`${escapeHtml(m)}\`)" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer text-xs font-semibold truncate">
                    ${escapeHtml(m)}
                </div>
            `).join('');
            box.classList.remove('hidden');
        }

        function applySuggestion(id, type, value) {
            const field = type === 'term' ? 'term' : 'definition';
            updateEditorTerm(id, field, value);
            renderEditorCards();

        function removeEditorCard(id) {
            if (editorTerms.length <= 1) {

                return;

            editorTerms = editorTerms.filter(t => t.id !== id);
            renderEditorCards();

        function updateEditorTerm(id, field, val) {
            const item = editorTerms.find(t => t.id === id);
            if (item) item[field] = val;
        }

        function processCreatorTextImport() {
            const raw = document.getElementById('creator-import-textarea').value.trim();
            const sep = document.getElementById('creator-import-sep').value;
            if (!raw) return;
            const lines = raw.split('\n');
            let added = 0;
            lines.forEach(line => {
                if (!line.trim()) return;
                let parts = [];
                if (sep === 'tab') parts = line.split('\t');
                else if (sep === 'comma') parts = line.split(',');
                else if (sep === 'dash') parts = line.split(' - ');
                else {
                    if (line.includes('\t')) parts = line.split('\t');
                    else if (line.includes(' - ')) parts = line.split(' - ');
                    else if (line.includes(',')) parts = line.split(',');
                    else parts = [line, ''];
                }
                if (parts.length >= 2) {
                    editorTerms.push({
                        id: 't_' + Math.random(),
                        term: parts[0].trim(),
                        definition: parts.slice(1).join(' ').trim(),
                        image: '',
                        starred: false
                    });
                    added++;
                }
            });
            if (added > 0) {
                renderEditorCards();
                document.getElementById('creator-import-box').classList.add('hidden');
                document.getElementById('creator-import-textarea').value = '';
            } else {
                showModal('Error', 'No valid term-definition pairs found.');
            }
        }

            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                updateEditorTerm(id, 'image', evt.target.result);
                renderEditorCards();
            };
            reader.readAsDataURL(file);
        }

            const validTerms = editorTerms.filter(t => t.term.trim() !== '' || t.definition.trim() !== '');

                showModal('Error', 'Please add at least one valid term and definition.');
                return;

            const db = getDB();
            const setId = currentEditingSetId || 'set_' + Date.now();
            const existingIndex = db.sets.findIndex(s => s.id === setId);

            const setObj = {
                id: setId,
                title,
                description,
                folderId,
                createdAt: existingIndex >= 0 ? db.sets[existingIndex].createdAt : Date.now(),
                terms: validTerms.map(t => ({
                    id: t.id || 't_' + Math.random(),
                    term: t.term.trim(),
                    definition: t.definition.trim(),
                    image: t.image || '',
                    starred: t.starred || false
                }))
            };

            if (existingIndex >= 0) {
                db.sets[existingIndex] = setObj;
            } else {
                db.sets.push(setObj);
            }

            saveDB(db);
            window.router.navigate('study', { setId });

        function initFlashcardsEngine(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set) return;
            fcState.set = set;
            fcState.cards = [...set.terms];
            fcState.index = 0;
            fcState.flipped = false;
            fcState.swapRoles = false;
            updateFlashcardUI();

            window.onkeydown = function(e) {
                if (window.router.currentView !== 'flashcards') return;
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                    e.preventDefault();
                    flipFlashcard();
                } else if (e.code === 'ArrowRight') {
                    markFcCard(true);
                } else if (e.code === 'ArrowLeft') {
                    markFcCard(false);
                }
            };
        }

        function toggleFcSwap() {
            fcState.swapRoles = document.getElementById('fc-swap').checked;
            updateFlashcardUI();
        }

        function resetFcSession() {
            fcState.cards = [...fcState.set.terms];
            fcState.index = 0;
            fcState.flipped = false;
            updateFlashcardUI();
        }

        function markFcCard(know) {
            if (fcState.cards.length === 0) return;
            if (know) {
                fcState.cards.splice(fcState.index, 1);
            } else {
                fcState.index = (fcState.index + 1) % fcState.cards.length;
            }
            if (fcState.index >= fcState.cards.length) {
                fcState.index = 0;
            }
            fcState.flipped = false;
            updateFlashcardUI();
        }

        function updateFlashcardUI() {
            const inner = document.getElementById('fc-inner');
            if (fcState.cards.length === 0) {
                document.getElementById('fc-front').innerText = "Session Complete!";
                document.getElementById('fc-back').innerText = "You marked all cards as known.";
                document.getElementById('fc-counter').innerText = `0 / 0`;
                inner.classList.remove('transition-transform', 'duration-300');
                inner.style.transform = 'rotateY(0deg)';
                return;
            }
            const c = fcState.cards[fcState.index];
            const termText = fcState.swapRoles ? c.definition : c.term;
            const defText = fcState.swapRoles ? c.term : c.definition;

            document.getElementById('fc-front-label').innerText = fcState.swapRoles ? "Definition" : "Term";
            document.getElementById('fc-back-label').innerText = fcState.swapRoles ? "Term" : "Definition";

            document.getElementById('fc-front').innerText = termText;
            document.getElementById('fc-back').innerText = defText;
            document.getElementById('fc-counter').innerText = `${fcState.index + 1} / ${fcState.cards.length}`;
            
            document.getElementById('fc-front-img').innerHTML = c.image ? `<img src="${c.image}" class="h-28 rounded-xl object-cover border border-qBorderLight dark:border-qBorderDark">` : '';
            document.getElementById('fc-back-img').innerHTML = c.image ? `<img src="${c.image}" class="h-28 rounded-xl object-cover border border-qBorderLight dark:border-qBorderDark">` : '';

            if (fcState.flipped) {
                inner.classList.add('transition-transform', 'duration-300');
                inner.style.transform = 'rotateY(180deg)';
            } else {
                inner.classList.remove('transition-transform', 'duration-300');
                inner.style.transform = 'rotateY(0deg)';
            }
        }

        function flipFlashcard() {
            fcState.flipped = !fcState.flipped;
            playSound('flip');
            updateFlashcardUI();
        }

        function speakCurrentCard() {
            if (fcState.cards.length === 0) return;
            const c = fcState.cards[fcState.index];
            const termText = fcState.swapRoles ? c.definition : c.term;
            const defText = fcState.swapRoles ? c.term : c.definition;
            const text = fcState.flipped ? defText : termText;
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        let testState = { set: null, questions: [] };

        let matchState = { set: null, items: [], selected: null, timer: 0, interval: null, playing: false, swapRoles: false, difficulty: 'normal' };

        function initMatchEngine(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set || set.terms.length === 0) return;
            matchState.set = set;

            const swap = document.getElementById('match-swap') ? document.getElementById('match-swap').checked : false;
            const diff = document.getElementById('match-diff') ? document.getElementById('match-diff').value : 'normal';

            let count = 6;
            if (diff === 'easy') count = 4;
            if (diff === 'hard') count = 8;

            const subset = [...set.terms].sort(() => Math.random() - 0.5).slice(0, count);
            let deck = [];
            subset.forEach(t => {
                deck.push({ id: t.id, text: swap ? t.definition : t.term, type: 'term', matched: false });
                deck.push({ id: t.id, text: swap ? t.term : t.definition, type: 'def', matched: false });
            });
            deck.sort(() => Math.random() - 0.5);

            matchState.items = deck;
            matchState.selected = null;
            matchState.timer = 0;
            matchState.playing = true;

            if (matchState.interval) clearInterval(matchState.interval);
            matchState.interval = setInterval(() => {
                if (!matchState.playing) return;
                matchState.timer += 0.1;
                document.getElementById('match-timer').innerText = matchState.timer.toFixed(1) + 's';
            }, 100);

            renderMatchBoard();
        }

        function renderMatchBoard() {
            const board = document.getElementById('match-board');
            if (matchState.items.every(i => i.matched)) {
                matchState.playing = false;
                clearInterval(matchState.interval);
                playSound('success');
                board.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white dark:bg-[#181632] rounded-3xl border border-qBorderLight dark:border-qBorderDark space-y-4">
                        <h2 class="text-2xl font-black">Finished in ${matchState.timer.toFixed(1)}s!</h2>
                        <button onclick="initMatchEngine('${matchState.set.id}')" class="bg-qBlue text-white font-bold px-6 py-2.5 rounded-xl text-sm">Play Again</button>
                    </div>
                `;
                return;
            }

            board.innerHTML = matchState.items.map((item, idx) => `
                <div onclick="selectMatchItem(${idx})" class="h-32 bg-white dark:bg-[#181632] border-2 ${item.matched ? 'opacity-0 pointer-events-none' : matchState.selected === idx ? 'border-qBlue bg-blue-50 dark:bg-slate-800' : 'border-qBorderLight dark:border-qBorderDark'} rounded-2xl p-4 flex items-center justify-center text-center cursor-pointer transition text-xs font-bold">
                    ${escapeHtml(item.text)}
                </div>
            `).join('');
        }

        function selectMatchItem(idx) {
            const clicked = matchState.items[idx];
            if (matchState.selected === null) {
                matchState.selected = idx;
                renderMatchBoard();
            } else if (matchState.selected === idx) {
                matchState.selected = null;
                renderMatchBoard();
            } else {
                const first = matchState.items[matchState.selected];
                if (first.id === clicked.id && first.type !== clicked.type) {
                    first.matched = true;
                    clicked.matched = true;
                    playSound('success');
                    matchState.selected = null;
                    renderMatchBoard();

        let blastState = { set: null, activeAsteroids: [], score: 0, interval: null, canvas: null, ctx: null, running: false, swapRoles: false, speedMult: 1 };

        function renderBlast(setId) {
            return `
                <div class="max-w-4xl mx-auto space-y-4 pb-16 flex flex-col items-center">
                    <div class="w-full flex flex-wrap justify-between items-center bg-white dark:bg-[#181632] px-6 py-4 rounded-2xl border border-qBorderLight dark:border-qBorderDark shadow-sm gap-4">
                        <button onclick="window.router.navigate('study', {setId: '${setId}'})" class="text-xs font-bold text-qBlue uppercase tracking-wider hover:underline">&larr; Back</button>
                        <div class="flex items-center gap-3 text-xs font-bold">
                            <label class="flex items-center gap-1 cursor-pointer">
                                <input type="checkbox" id="blast-swap" onchange="initBlastEngine('${setId}')"> Swap Prompt/Answer
                            </label>
                            <select id="blast-diff" onchange="initBlastEngine('${setId}')" class="bg-slate-100 dark:bg-slate-800 p-1.5 rounded-lg border border-qBorderLight dark:border-qBorderDark outline-none">

                    <div class="relative w-full bg-slate-900 rounded-3xl overflow-hidden border border-qBorderLight dark:border-qBorderDark shadow-2xl">

                        <div id="blast-input-bar" class="absolute bottom-4 left-4 right-4 flex gap-2">
                            <input type="text" id="blast-typing-input" onkeydown="handleBlastInput(event)" placeholder="Type answer & press Enter..." class="w-full bg-black/60 backdrop-blur-md border border-slate-700 text-white px-4 py-3 rounded-2xl text-sm outline-none focus:border-qBlue">
                        </div>

                </div>
            `;

        function initBlastEngine(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set || set.terms.length === 0) return;

            const swap = document.getElementById('blast-swap') ? document.getElementById('blast-swap').checked : false;
            const diff = document.getElementById('blast-diff') ? parseFloat(document.getElementById('blast-diff').value) : 1;

            blastState.set = set;
            blastState.score = 0;
            blastState.activeAsteroids = [];
            blastState.running = true;
            blastState.swapRoles = swap;
            blastState.speedMult = diff;

            const canvas = document.getElementById('blast-canvas');
            blastState.canvas = canvas;
            blastState.ctx = canvas.getContext('2d');

            if (blastState.interval) clearInterval(blastState.interval);

            blastState.interval = setInterval(() => {
                if (!blastState.running) return;
                if (blastState.activeAsteroids.length < 5) {
                    const termObj = set.terms[Math.floor(Math.random() * set.terms.length)];
                    blastState.activeAsteroids.push({
                        id: termObj.id,
                        prompt: blastState.swapRoles ? termObj.definition : termObj.term,
                        target: blastState.swapRoles ? termObj.term : termObj.definition,
                        x: Math.random() * 600 + 50,
                        y: -30,
                        speed: (0.5 + Math.random() * 0.8) * blastState.speedMult
                    });
                }
            }, 3000);

            requestAnimationFrame(blastLoop);
            setTimeout(() => {
                const el = document.getElementById('blast-typing-input');
                if (el) el.focus();
            }, 100);
        }

        function blastLoop() {
            if (!blastState.running) return;
            const ctx = blastState.ctx;
            if (!ctx) return;
            ctx.clearRect(0, 0, 800, 450);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(100, 100, 2, 2);
            ctx.fillRect(400, 80, 2, 2);
            ctx.fillRect(700, 300, 2, 2);

            blastState.activeAsteroids.forEach(ast => {
                ast.y += ast.speed;
                ctx.fillStyle = '#282e3f';
                ctx.beginPath();
                ctx.arc(ast.x, ast.y, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#3ccfcf';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(ast.prompt.substring(0, 15), ast.x, ast.y + 4);

                if (ast.y > 430) {
                    blastState.running = false;
                    showModal('Game Over', `Asteroid hit surface! Final Score: ${blastState.score}`, () => window.router.navigate('study', { setId: blastState.set.id }));
                }
            });

            requestAnimationFrame(blastLoop);
        }

                    document.getElementById('blast-score').innerText = `Score: ${blastState.score}`;

        function canPlaceShape(shape, startR, startC) {
            const rows = shape.length;

            if (startR + rows > 8 || startC + cols > 8) return false;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] === 1 && blocksState.grid[startR + r][startC + c] === 1) {
                        return false;
                    }
                }
            }
            return true;
        }

        function placeBlockAt(r, c) {
            if (blocksState.selectedShapeIndex === null || blocksState.modalOpen) return;
            const shape = blocksState.dock[blocksState.selectedShapeIndex];
            if (!shape) return;

            if (!canPlaceShape(shape, r, c)) {
                playSound('error');
                return;
            }

            // Write shape onto grid
            for (let sr = 0; sr < shape.length; sr++) {
                for (let sc = 0; sc < shape[0].length; sc++) {
                    if (shape[sr][sc] === 1) {
                        blocksState.grid[r + sr][c + sc] = 1;
                        blocksState.score += 10;
                    }
                }
            }

            playSound('flip');
            blocksState.dock[blocksState.selectedShapeIndex] = null;
            blocksState.selectedShapeIndex = null;
            blocksState.placedCount++;

            // Clear full lines/columns
            clearGridLines();

            // Check for Quiz Checkpoint every 3 placed tiles
            if (blocksState.placedCount % 3 === 0) {
                triggerBlocksQuizCheckpoint();
            } else {
                renderBlocksBoard();
            }
        }

        function clearGridLines() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < 8; r++) {
                if (blocksState.grid[r].every(val => val === 1)) rowsToClear.push(r);
            }

            for (let c = 0; c < 8; c++) {
                let full = true;
                for (let r = 0; r < 8; r++) {
                    if (blocksState.grid[r][c] !== 1) { full = false; break; }
                }
                if (full) colsToClear.push(c);
            }

            if (rowsToClear.length > 0 || colsToClear.length > 0) {
                playSound('success');
                rowsToClear.forEach(r => {
                    for (let c = 0; c < 8; c++) blocksState.grid[r][c] = 0;
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < 8; r++) blocksState.grid[r][c] = 0;
                });
                blocksState.score += (rowsToClear.length + colsToClear.length) * 100;
            }
        }

        function triggerBlocksQuizCheckpoint() {
            blocksState.modalOpen = true;
            const terms = blocksState.set.terms;
            const current = terms[Math.floor(Math.random() * terms.length)];
            
            const distractors = terms.filter(t => t.id !== current.id).sort(() => Math.random() - 0.5).slice(0, 3);
            const options = [current, ...distractors].sort(() => Math.random() - 0.5);

            const isSwap = blocksState.swapRoles;
            const promptText = isSwap ? current.definition : current.term;

            document.getElementById('blocks-q-type-label').innerText = isSwap ? "Select the matching Term:" : "Select the matching Definition:";
            document.getElementById('blocks-q-prompt').innerText = promptText;

            const optionsContainer = document.getElementById('blocks-q-options');
            optionsContainer.innerHTML = options.map(opt => {
                const optText = isSwap ? opt.term : opt.definition;
                return `
                    <button onclick="answerBlocksCheckpoint('${opt.id}', '${current.id}')" 
                            class="w-full text-left p-3.5 rounded-xl border border-qBorderLight dark:border-qBorderDark hover:border-qBlue hover:bg-blue-50 dark:hover:bg-slate-800 text-xs sm:text-sm font-semibold transition">
                        ${escapeHtml(optText)}
                    </button>
                `;
            }).join('');

            document.getElementById('blocks-challenge-modal').classList.remove('hidden');
        }

        function answerBlocksCheckpoint(selectedId, correctId) {
            if (selectedId === correctId) {
                playSound('success');
                blocksState.modalOpen = false;
                document.getElementById('blocks-challenge-modal').classList.add('hidden');
                
                // Unlock next batch of 3 dock shapes
                replenishBlocksDock();
                renderBlocksBoard();
            } else {
                playSound('error');
                const btn = event.currentTarget;
                btn.classList.add('border-red-500', 'bg-red-50', 'dark:bg-red-950/40', 'text-red-500');
            }
        }

        function checkBlocksGameOver() {
            if (blocksState.modalOpen) return;

            const availableShapes = blocksState.dock.filter(s => s !== null);
            if (availableShapes.length === 0) return;

            let canPlaceAny = false;
            for (let shape of availableShapes) {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (canPlaceShape(shape, r, c)) {
                            canPlaceAny = true;
                            break;
                        }
                    }
                    if (canPlaceAny) break;
                }
                if (canPlaceAny) break;
            }

            if (!canPlaceAny) {
                showModal('Game Over', `No more valid moves remaining! Final Score: ${blocksState.score}`, () => {
                    initBlocksEngine(blocksState.set.id);
                });
            }
        }

        let memoryState = { set: null, cards: [], selected: [], matched: [] };

        function renderMemory(setId) {
            return `
                <div class="max-w-4xl mx-auto space-y-6 pb-16">
                    <div class="flex justify-between items-center bg-white dark:bg-[#181632] px-6 py-4 rounded-2xl border border-qBorderLight dark:border-qBorderDark shadow-sm">
                        <button onclick="window.router.navigate('study', {setId: '${setId}'})" class="text-xs font-bold text-qBlue uppercase tracking-wider hover:underline">&larr; Back</button>
                        <h2 class="text-sm font-bold">Memory Grid</h2>
                    </div>
                    <div id="memory-board" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>
                </div>
            `;
        }

        function initMemoryEngine(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set || set.terms.length === 0) return;

            memoryState.set = set;
            memoryState.selected = [];
            memoryState.matched = [];

            const subset = [...set.terms].sort(() => Math.random() - 0.5).slice(0, 6);
            let deck = [];
            subset.forEach(t => {
                deck.push({ id: t.id, text: t.term, uid: Math.random() });
                deck.push({ id: t.id, text: t.definition, uid: Math.random() });
            });
            deck.sort(() => Math.random() - 0.5);
            memoryState.cards = deck;

            renderMemoryBoard();
        }

        function renderMemoryBoard() {
            const board = document.getElementById('memory-board');
            if (!board) return;

            if (memoryState.matched.length === memoryState.cards.length && memoryState.cards.length > 0) {
                playSound('success');
                board.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white dark:bg-[#181632] rounded-3xl border border-qBorderLight dark:border-qBorderDark space-y-4">
                        <h2 class="text-2xl font-black">Memory Grid Cleared!</h2>
                        <button onclick="initMemoryEngine('${memoryState.set.id}')" class="bg-qBlue text-white font-bold px-6 py-2.5 rounded-xl text-sm">Play Again</button>
                    </div>
                `;
                return;
            }

            board.innerHTML = memoryState.cards.map((c, idx) => {
                const isMatched = memoryState.matched.includes(c.uid);
                const isSelected = memoryState.selected.includes(idx);
                return `
                    <div onclick="flipMemoryCard(${idx})" class="h-28 bg-white dark:bg-[#181632] border-2 ${isMatched ? 'opacity-20 pointer-events-none border-transparent' : isSelected ? 'border-qBlue bg-blue-50 dark:bg-slate-800' : 'border-qBorderLight dark:border-qBorderDark'} rounded-2xl p-4 flex items-center justify-center text-center cursor-pointer transition text-xs font-bold">
                        ${isSelected || isMatched ? escapeHtml(c.text) : '❓'}
                    </div>
                `;
            }).join('');
        }

        function flipMemoryCard(idx) {
            if (memoryState.selected.length >= 2 || memoryState.selected.includes(idx)) return;
            memoryState.selected.push(idx);
            renderMemoryBoard();

            if (memoryState.selected.length === 2) {
                const c1 = memoryState.cards[memoryState.selected[0]];
                const c2 = memoryState.cards[memoryState.selected[1]];
                if (c1.id === c2.id && c1.uid !== c2.uid) {
                    memoryState.matched.push(c1.uid, c2.uid);
                    memoryState.selected = [];
                    playSound('success');
                    renderMemoryBoard();
                } else {
                    playSound('error');
                    setTimeout(() => {
                        memoryState.selected = [];
                        renderMemoryBoard();
                    }, 1000);
                }
            }
        }

        function shareSetCode(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set) return;
            const code = btoa(encodeURIComponent(JSON.stringify(set)));
            const html = `<textarea readonly class="w-full h-28 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs font-mono select-all">${code}</textarea>`;
            showModal('Share Code', 'Copy this share code to send to friends or import instantly.', null, html);
        }

        function openShareCodeModal() {
            const html = `
                <textarea id="import-code-input" placeholder="Paste share code here..." class="w-full h-28 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs font-mono outline-none mb-2"></textarea>
                <button onclick="importFromShareCode()" class="w-full bg-qBlue text-white font-bold py-2 rounded-xl text-sm">Import Set</button>
            `;
            showModal('Import Share Code', 'Paste a QuizIt share code below.', null, html);
        }

        function importFromShareCode() {
            const code = document.getElementById('import-code-input').value.trim();
            try {
                const set = JSON.parse(decodeURIComponent(atob(code)));
                if (!set.title || !Array.isArray(set.terms)) throw new Error();
                const db = getDB();
                if (!db.sets.some(s => s.id === set.id)) {
                    db.sets.push(set);
                    saveDB(db);
                }
                closeModal();
                showModal('Success', 'Study set imported successfully!');
                window.router.navigate('library');
            } catch (err) {
                showModal('Error', 'Invalid share code format.');
            }
        }

        function exportSetJson(setId) {
            const db = getDB();
            const set = db.sets.find(s => s.id === setId);
            if (!set) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(set, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `${set.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_quizit.json`);
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function exportAllData() {
            const db = getDB();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "quizit_backup_" + Date.now() + ".json");
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function openAdvancedImportModal() {
            const html = `
                <div class="space-y-4">
                    <div class="flex border-b border-qBorderLight dark:border-qBorderDark text-xs font-bold">
                        <button onclick="switchImportTab('text')" id="itab-text" class="flex-1 py-2 border-b-2 border-qBlue text-qBlue">Paste Text / Quizlet</button>
                        <button onclick="switchImportTab('file')" id="itab-file" class="flex-1 py-2 text-slate-400">JSON File</button>
                    </div>
                    <div id="import-pane-text" class="space-y-3">
                        <p class="text-xs text-slate-500">Paste terms and definitions from Word, Excel, or Quizlet.</p>
                        <input type="text" id="import-set-title-input" placeholder="Set Title (Optional)" class="w-full bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl text-xs outline-none">
                        <textarea id="import-raw-textarea" placeholder="Term 1 \t Definition 1&#10;Term 2 \t Definition 2" class="w-full h-32 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs font-mono outline-none"></textarea>
                        <div class="flex gap-2">
                            <select id="import-separator" class="bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-xs outline-none flex-1">
                                <option value="auto">Auto-detect Separator</option>
                                <option value="tab">Tab (\\t)</option>
                                <option value="comma">Comma (,)</option>
                                <option value="dash">Dash (-)</option>
                            </select>
                            <button onclick="processTextImport()" class="bg-qBlue text-white font-bold px-4 py-2 rounded-xl text-xs">Import Text</button>
                        </div>
                    </div>
                    <div id="import-pane-file" class="space-y-3 hidden">
                        <p class="text-xs text-slate-500">Upload a QuizIt JSON backup file.</p>
                        <input type="file" id="import-file-input" accept=".json" class="w-full text-xs text-slate-500">
                        <button onclick="processImportFile()" class="w-full bg-qBlue text-white font-bold py-2 rounded-xl text-sm">Upload & Import</button>
                    </div>
                </div>
            `;
            showModal('Advanced Import', 'Choose your import source.', null, html);
        }

        function switchImportTab(tab) {
            const tText = document.getElementById('itab-text');
            const tFile = document.getElementById('itab-file');
            const pText = document.getElementById('import-pane-text');
            const pFile = document.getElementById('import-pane-file');
            if (tab === 'text') {
                tText.className = 'flex-1 py-2 border-b-2 border-qBlue text-qBlue font-bold';
                tFile.className = 'flex-1 py-2 text-slate-400';
                pText.classList.remove('hidden');
                pFile.classList.add('hidden');
            } else {
                tFile.className = 'flex-1 py-2 border-b-2 border-qBlue text-qBlue font-bold';
                tText.className = 'flex-1 py-2 text-slate-400';
                pFile.classList.remove('hidden');
                pText.classList.add('hidden');
            }
        }

        function processTextImport() {
            const titleVal = document.getElementById('import-set-title-input').value.trim() || 'Imported Set ' + new Date().toLocaleDateString();
            const rawText = document.getElementById('import-raw-textarea').value.trim();
            const sepMode = document.getElementById('import-separator').value;
            if (!rawText) {
                showModal('Error', 'Paste some terms and definitions first.');
                return;
            }

            const lines = rawText.split('\n');
            const terms = [];
            lines.forEach((line) => {
                if (!line.trim()) return;
                let parts = [];
                if (sepMode === 'tab') parts = line.split('\t');
                else if (sepMode === 'comma') parts = line.split(',');
                else if (sepMode === 'dash') parts = line.split(' - ');
                else {
                    if (line.includes('\t')) parts = line.split('\t');
                    else if (line.includes(' - ')) parts = line.split(' - ');
                    else if (line.includes(',')) parts = line.split(',');
                    else parts = [line, ''];
                }

                if (parts.length >= 2) {
                    terms.push({
                        id: 't_' + Math.random(),
                        term: parts[0].trim(),
                        definition: parts.slice(1).join(' ').trim(),
                        image: '',
                        starred: false
                    });
                }
            });

            if (terms.length === 0) {
                showModal('Error', 'Could not parse any valid term-definition pairs.');
                return;
            }

            const db = getDB();
            const newSet = {
                id: 'set_' + Date.now(),
                title: titleVal,
                description: 'Imported via text paste',
                folderId: '',
                createdAt: Date.now(),
                terms
            };
            db.sets.push(newSet);
            saveDB(db);
            closeModal();
            showModal('Success', `Successfully imported ${terms.length} terms!`);
            window.router.navigate('study', { setId: newSet.id });
        }

        function processImportFile() {
            const fileInput = document.getElementById('import-file-input');
            if (!fileInput.files.length) return;
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    const db = getDB();
                    if (parsed.sets && Array.isArray(parsed.sets)) {
                        db.sets = [...db.sets, ...parsed.sets];
                        if (parsed.folders) db.folders = [...db.folders, ...parsed.folders];
                    } else if (parsed.title && Array.isArray(parsed.terms)) {
                        db.sets.push(parsed);
                    }
                    saveDB(db);
                    closeModal();
                    showModal('Success', 'Data imported successfully!');
                    window.router.navigate('library');
                } catch (err) {
                    showModal('Error', 'Invalid JSON structure.');
                }
            };
            reader.readAsText(file);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const settings = getSettings();
            applyTheme(settings.darkMode);
            window.router.navigate('dashboard');
        });
    </script>
</body>
</html>
